<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050707">
  <title>ICSE 2027 Countdown</title>

  <style>
    :root {
      /* Adjust these values to fit your background screen */
      --screen-left: 37.3%;
      --screen-top: 32.8%;
      --screen-width: 44.5%;
      --screen-height: 28.5%;

      --amber: #ffc66b;
      --amber-bright: #ffe0a0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050707;
      color: var(--amber);
      font-family: "Arial Narrow", "Bahnschrift", Arial, sans-serif;
    }

    body {
      position: relative;
      isolation: isolate;
    }

    /* Place background.jpg in the same folder as index.html */
    .scene {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: #050707 url("./background.jpg")
        center center / cover no-repeat;
    }

    /* Cinematic shadows */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 55% 48%,
          transparent 42%,
          rgba(0, 0, 0, 0.28) 100%
        );
    }

    /* Transparent overlay positioned over the physical screen */
    .display-content {
      position: absolute;
      left: var(--screen-left);
      top: var(--screen-top);
      width: var(--screen-width);
      height: var(--screen-height);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      overflow: hidden;
      padding: 1.5% 2%;

      color: var(--amber);

      text-shadow:
        0 0 2px rgba(255, 202, 116, 0.95),
        0 0 8px rgba(255, 169, 61, 0.42),
        0 0 18px rgba(255, 153, 36, 0.15);

      transform: perspective(900px) rotateY(-1deg);
      transform-origin: center;
    }

    .eyebrow {
      margin: 0 0 clamp(3px, 0.65vw, 12px);
      color: rgba(255, 205, 130, 0.82);
      font-size: clamp(7px, 1.05vw, 17px);
      line-height: 1;
      letter-spacing: 0.28em;
      font-weight: 600;
    }

    .timer {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(3px, 0.75vw, 14px);
      width: 100%;
      white-space: nowrap;

      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }

    .value {
      font-size: clamp(15px, 3.25vw, 56px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: 0.025em;
      color: var(--amber-bright);
    }

    .label {
      margin-top: clamp(2px, 0.45vw, 8px);
      font-size: clamp(5px, 0.72vw, 12px);
      line-height: 1;
      letter-spacing: 0.12em;
      color: rgba(255, 208, 139, 0.8);
    }

    .headline {
      margin: clamp(6px, 1.1vw, 18px) 0 0;
      font-size: clamp(10px, 1.85vw, 31px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: 0.055em;
      color: #ffd28a;
    }

    .subline {
      margin: clamp(2px, 0.35vw, 6px) 0 0;
      font-size: clamp(7px, 1.2vw, 20px);
      line-height: 1.1;
      letter-spacing: 0.07em;
      color: rgba(255, 211, 149, 0.92);
    }

    .complete .timer {
      display: none;
    }

    .complete .headline {
      margin-top: 0;
    }

    @media (max-aspect-ratio: 4/3) {
      .scene {
        background-size: contain;
      }

      .vignette {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="scene" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main
    class="display-content"
    id="display"
    aria-label="ICSE 2027 live countdown"
  >
    <p class="eyebrow">EXAM COUNTDOWN</p>

    <div class="timer" aria-live="off">
      <div class="unit">
        <span class="value" id="days">000</span>
        <span class="label">DAYS</span>
      </div>

      <div class="unit">
        <span class="value" id="hours">00</span>
        <span class="label">HRS</span>
      </div>

      <div class="unit">
        <span class="value" id="minutes">00</span>
        <span class="label">MIN</span>
      </div>

      <div class="unit">
        <span class="value" id="seconds">00</span>
        <span class="label">SEC</span>
      </div>
    </div>

    <p class="headline">ICSE 2027</p>
    <p class="subline" id="status">COUNTING DOWN TO EXAM DAY</p>
  </main>

  <script>
    /*
      CONFIGURATION

      This is a provisional example date, NOT an official
      ICSE examination date.

      Format:
      new Date(year, month, day, hours, minutes, seconds)

      JavaScript months start at zero:
      0 = January, 1 = February, 2 = March, etc.

      The countdown uses your computer's local time.
    */

    const TARGET_DATE = new Date(2027, 1, 17, 11, 0, 0);

    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
      status: document.getElementById("status"),
      display: document.getElementById("display")
    };

    function pad2(number) {
      return String(number).padStart(2, "0");
    }

    function updateCountdown() {
      const remainingMs = TARGET_DATE.getTime() - Date.now();

      if (remainingMs <= 0) {
        elements.days.textContent = "000";
        elements.hours.textContent = "00";
        elements.minutes.textContent = "00";
        elements.seconds.textContent = "00";

        elements.status.textContent = "EXAM DAY";
        elements.display.classList.add("complete");

        return;
      }

      elements.display.classList.remove("complete");

      const totalSeconds = Math.floor(remainingMs / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      elements.days.textContent = String(days).padStart(3, "0");
      elements.hours.textContent = pad2(hours);
      elements.minutes.textContent = pad2(minutes);
      elements.seconds.textContent = pad2(seconds);
    }

    // Display immediately, then refresh regularly.
    updateCountdown();

    // Refresh four times per second to keep the display synchronized.
    setInterval(updateCountdown, 250);
  </script>
</body>
</html>
