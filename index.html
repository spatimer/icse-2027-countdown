
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-B Exam Countdown</title>

<style>
:root {
    --gold: #e7b76b;
    --gold-light: #ffdda0;
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #071225 url("background.jpg") center center / cover no-repeat;
    color: var(--gold-light);
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#wallpaper {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}

/* COUNTDOWN PANEL */

.countdown-panel {
    position: absolute;
    left: 60%;
    top: 44%;
    width: min(1350px, 72vw);
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
}

.class-heading {
    margin: 0 0 12px;
    color: var(--gold-light);
    font-size: clamp(18px, 2vw, 30px);
    font-weight: 600;
    letter-spacing: 7px;
    text-shadow: 0 0 14px rgba(255, 190, 80, .3);
}

.main-heading {
    margin: 0 0 30px;
    color: var(--gold-light);
    font-size: clamp(22px, 3vw, 44px);
    font-weight: 700;
    letter-spacing: 5px;
    text-shadow:
        0 0 12px rgba(255, 190, 80, .35),
        0 0 28px rgba(255, 175, 40, .18);
}

/* COUNTDOWN NUMBERS */

.countdown {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(8px, 1.5vw, 24px);
    width: 100%;
}

.time-unit {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
}

.number {
    color: var(--gold-light);
    font-size: min(4.2vw, 68px);
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    text-shadow:
        0 0 10px rgba(255, 190, 80, .4),
        0 0 24px rgba(255, 175, 40, .2);
}

.unit-label {
    margin-top: 12px;
    color: var(--gold);
    font-size: clamp(10px, 1.1vw, 16px);
    font-weight: 600;
    letter-spacing: 3px;
}

.colon {
    flex: 0 0 auto;
    color: var(--gold);
    font-size: min(3.6vw, 54px);
    line-height: 1.05;
    opacity: .85;
    text-shadow: 0 0 12px rgba(255, 190, 80, .25);
}

.motivation {
    margin: 35px 0 0;
    color: rgba(255, 221, 160, .9);
    font-size: clamp(12px, 1.3vw, 18px);
    letter-spacing: 1.5px;
    text-shadow: 0 0 12px rgba(255, 190, 80, .2);
}

/* SOUND BUTTON */

#soundButton {
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 50;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 221, 160, .2);
    border-radius: 50%;
    background: rgba(8, 12, 20, .2);
    color: rgba(255, 221, 160, .65);
    font-size: 24px;
    cursor: pointer;
    opacity: .55;
    transition: opacity .2s, background .2s;
    -webkit-tap-highlight-color: transparent;
}

#soundButton:hover {
    opacity: .9;
    background: rgba(8, 12, 20, .4);
}

#soundButton:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: 4px;
}

/* BRIGHT GOLDEN TOUCH GLOW */

.touch-glow {
    position: fixed;
    z-index: 40;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    background: radial-gradient(
        circle,
        rgba(255, 225, 105, .65) 0%,
        rgba(255, 205, 65, .42) 18%,
        rgba(255, 180, 25, .23) 40%,
        rgba(255, 160, 10, .08) 62%,
        rgba(255, 160, 10, 0) 75%
    );
    filter: blur(3px);
    mix-blend-mode: screen;
    will-change: left, top;
}

/* DAILY POPUP
   Transparent PNGs show only their visible pixels.
*/

#popup-image {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 30;
    width: min(55vw, 650px);
    max-height: 70vh;
    object-fit: contain;
    transform: translate(-50%, -50%);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#popup-image.show {
    animation: popupDisplay 3s ease-in-out forwards;
}

@keyframes popupDisplay {
    0% {
        opacity: 0;
        visibility: visible;
        transform: translate(-50%, -50%) scale(.94);
    }
    15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    100% {
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, -50%) scale(.98);
    }
}

/* SMALL SCREEN ADJUSTMENTS */

@media (max-width: 700px) {
    .countdown-panel {
        left: 50%;
        top: 45%;
        width: 94vw;
    }

    .class-heading {
        letter-spacing: 4px;
    }

    .main-heading {
        margin-bottom: 22px;
        letter-spacing: 3px;
    }

    .countdown {
        gap: 4px;
    }

    .number {
        font-size: clamp(21px, 5.5vw, 38px);
    }

    .unit-label {
        margin-top: 8px;
        font-size: 8px;
        letter-spacing: 1px;
    }

    .colon {
        font-size: 24px;
    }

    .motivation {
        margin-top: 25px;
        font-size: 12px;
    }

    #popup-image {
        width: 80vw;
    }
}
</style>
</head>

<body>
<div id="wallpaper">

    <button id="soundButton"
            type="button"
            aria-label="Enable ticking sound"
            title="Toggle ticking sound">♩</button>

    <main class="countdown-panel">
        <h2 class="class-heading">X-B</h2>
        <h1 class="main-heading">EXAM COUNTDOWN</h1>

        <div class="countdown">
            <div class="time-unit">
                <div class="number" id="months">00</div>
                <div class="unit-label">MONTHS</div>
            </div>

            <div class="colon">:</div>

            <div class="time-unit">
                <div class="number" id="days">00</div>
                <div class="unit-label">DAYS</div>
            </div>

            <div class="colon">:</div>

            <div class="time-unit">
                <div class="number" id="hours">00</div>
                <div class="unit-label">HRS</div>
            </div>

            <div class="colon">:</div>

            <div class="time-unit">
                <div class="number" id="minutes">00</div>
                <div class="unit-label">MIN</div>
            </div>

            <div class="colon">:</div>

            <div class="time-unit">
                <div class="number" id="seconds">00</div>
                <div class="unit-label">SEC</div>
            </div>
        </div>

        <p class="motivation">
            Every second counts. Every effort matters.
        </p>
    </main>

    <img id="popup-image" src="popup.png" alt="">

</div>

<script>
/* =========================================
   EXAM COUNTDOWN
   17 February 2027, 12:00 PM IST
========================================= */

const TARGET_DATE = new Date("2027-02-17T12:00:00+05:30");

const monthElement = document.getElementById("months");
const dayElement = document.getElementById("days");
const hourElement = document.getElementById("hours");
const minuteElement = document.getElementById("minutes");
const secondElement = document.getElementById("seconds");

function updateCountdown() {
    const now = new Date();

    if (now >= TARGET_DATE) {
        monthElement.textContent = "00";
        dayElement.textContent = "00";
        hourElement.textContent = "00";
        minuteElement.textContent = "00";
        secondElement.textContent = "00";
        return;
    }

    // Count complete calendar months.
    let cursor = new Date(now);
    let months = 0;

    while (true) {
        const nextMonth = new Date(cursor);
        nextMonth.setMonth(nextMonth.getMonth() + 1);

        if (nextMonth > TARGET_DATE) break;

        cursor = nextMonth;
        months++;
    }

    let remaining = TARGET_DATE.getTime() - cursor.getTime();

    const days = Math.floor(remaining / 86400000);
    remaining -= days * 86400000;

    const hours = Math.floor(remaining / 3600000);
    remaining -= hours * 3600000;

    const minutes = Math.floor(remaining / 60000);
    remaining -= minutes * 60000;

    const seconds = Math.floor(remaining / 1000);

    monthElement.textContent = String(months).padStart(2, "0");
    dayElement.textContent = String(days).padStart(2, "0");
    hourElement.textContent = String(hours).padStart(2, "0");
    minuteElement.textContent = String(minutes).padStart(2, "0");
    secondElement.textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);


/* =========================================
   TICKING SOUND TOGGLE
========================================= */

const soundButton = document.getElementById("soundButton");

let soundEnabled = false;
let audioContext = null;
let tickTimer = null;

function playTick() {
    if (!soundEnabled || !audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(850, audioContext.currentTime);

    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.035, audioContext.currentTime + 0.005
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001, audioContext.currentTime + 0.045
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.05);
}

function startTicking() {
    stopTicking();
    playTick();
    tickTimer = setInterval(playTick, 1000);
}

function stopTicking() {
    if (tickTimer !== null) {
        clearInterval(tickTimer);
        tickTimer = null;
    }
}

soundButton.addEventListener("click", async () => {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            soundButton.title = "Audio is not supported";
            return;
        }

        audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    soundEnabled = !soundEnabled;

    if (soundEnabled) {
        soundButton.style.opacity = "1";
        soundButton.setAttribute("aria-label", "Disable ticking sound");
        startTicking();
    } else {
        soundButton.style.opacity = ".55";
        soundButton.setAttribute("aria-label", "Enable ticking sound");
        stopTicking();
    }
});


/* =========================================
   MULTI-TOUCH GOLDEN GLOW
   Supports mouse, touch, and pen pointers.
========================================= */

const activeGlows = new Map();

function createTouchGlow(pointerId, x, y) {
    let glow = activeGlows.get(pointerId);

    if (!glow) {
        glow = document.createElement("div");
        glow.className = "touch-glow";
        document.body.appendChild(glow);
        activeGlows.set(pointerId, glow);
    }

    moveTouchGlow(pointerId, x, y);
}

function moveTouchGlow(pointerId, x, y) {
    const glow = activeGlows.get(pointerId);
    if (!glow) return;

    glow.style.left = x + "px";
    glow.style.top = y + "px";
}

function removeTouchGlow(pointerId) {
    const glow = activeGlows.get(pointerId);

    if (glow) {
        glow.remove();
        activeGlows.delete(pointerId);
    }
}

document.addEventListener("pointerdown", event => {
    if (event.target.closest("#soundButton")) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    createTouchGlow(event.pointerId, event.clientX, event.clientY);
});

document.addEventListener("pointermove", event => {
    if (activeGlows.has(event.pointerId)) {
        moveTouchGlow(event.pointerId, event.clientX, event.clientY);
    }
});

document.addEventListener("pointerup", event => {
    removeTouchGlow(event.pointerId);
});

document.addEventListener("pointercancel", event => {
    removeTouchGlow(event.pointerId);
});

document.addEventListener("lostpointercapture", event => {
    removeTouchGlow(event.pointerId);
});


/* =========================================
   FALLBACK FOR MOUSE-ONLY SMARTBOARDS
   Prevent duplicate glows for mouse events
   already handled by pointer events.
========================================= */

let fallbackMouseActive = false;
let pointerMouseRecentlyUsed = false;
let pointerMouseTimeout = null;
const fallbackMouseId = "smartboard-mouse-fallback";

document.addEventListener("pointerdown", event => {
    if (event.pointerType !== "mouse") return;

    pointerMouseRecentlyUsed = true;
    clearTimeout(pointerMouseTimeout);

    pointerMouseTimeout = setTimeout(() => {
        pointerMouseRecentlyUsed = false;
    }, 1000);
});

document.addEventListener("mousedown", event => {
    if (event.target.closest("#soundButton")) return;
    if (event.button !== 0 || pointerMouseRecentlyUsed) return;

    fallbackMouseActive = true;
    createTouchGlow(fallbackMouseId, event.clientX, event.clientY);
});

document.addEventListener("mousemove", event => {
    if (!fallbackMouseActive) return;

    moveTouchGlow(fallbackMouseId, event.clientX, event.clientY);
});

document.addEventListener("mouseup", () => {
    fallbackMouseActive = false;
    removeTouchGlow(fallbackMouseId);
});

window.addEventListener("blur", () => {
    for (const pointerId of activeGlows.keys()) {
        removeTouchGlow(pointerId);
    }

    fallbackMouseActive = false;
});


/* =========================================
   DAILY POPUP AT 12:00 PM INDIA TIME
   Display for 3 seconds once per local day.
========================================= */

const popupImage = document.getElementById("popup-image");

let lastPopupDate = "";

const indiaTimeFormatter = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kolkata",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
});

const indiaHourFormatter = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Kolkata",
    hour: "2-digit",
    hourCycle: "h23"
});

const indiaMinuteFormatter = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Kolkata",
    minute: "2-digit"
});

function checkDailyPopup() {
    const now = new Date();

    const indiaDate = indiaTimeFormatter.format(now);
    const indiaHour = indiaHourFormatter.format(now);
    const indiaMinute = indiaMinuteFormatter.format(now);

    if (
        indiaHour === "12" &&
        indiaMinute === "00" &&
        lastPopupDate !== indiaDate
    ) {
        lastPopupDate = indiaDate;

        popupImage.classList.remove("show");

        // Restart the animation if necessary.
        void popupImage.offsetWidth;

        popupImage.classList.add("show");

        setTimeout(() => {
            popupImage.classList.remove("show");
        }, 3100);
    }
}

checkDailyPopup();
setInterval(checkDailyPopup, 1000);

</script>
</body>
</html>
