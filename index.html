
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11100c">
<title>ICSE 2027 Countdown</title>

<style>
:root {
  --gold: #f4c95d;
  --bright-gold: #ffe7a6;
  --soft-gold: #d8ad4c;
  --black: #11100c;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--black);
  font-family: Arial, Helvetica, sans-serif;
}

/* Preserve the entire 16:9 background image.
   Nothing is cropped or stretched. */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--black);
}

.background {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

/* Counter positioned over the empty wall */
.counter {
  position: absolute;
  left: 25%;
  top: 24%;
  width: 65%;
  height: 45%;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  padding: 1%;
  color: var(--gold);
}

/* Heading */
.eyebrow {
  margin: 0 0 2.5%;
  font-size: clamp(10px, 1.55vw, 23px);
  font-weight: 700;
  letter-spacing: 0.22em;
  white-space: nowrap;
  color: var(--gold);
}

/* Countdown numbers */
.timer {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: clamp(2px, 0.65vw, 10px);
  width: 100%;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.number {
  font-size: clamp(24px, 4.5vw, 68px);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.035em;
  color: var(--bright-gold);
  text-shadow: 0 0 12px rgba(244, 201, 93, 0.28);
}

.separator {
  font-size: clamp(22px, 3.8vw, 58px);
  line-height: 1;
  font-weight: 600;
  color: var(--soft-gold);
  margin-top: 0.1em;
}

.unit-label {
  margin-top: 0.65em;
  font-size: clamp(9px, 1.25vw, 19px);
  letter-spacing: 0.13em;
  color: var(--gold);
}

/* Exam title */
.exam-title {
  margin: 3.5% 0 0;
  font-size: clamp(20px, 3.3vw, 50px);
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: 0.025em;
  color: var(--bright-gold);
  white-space: nowrap;
}

/* Motivational message */
.motivation {
  margin: 1.7% 0 0;
  font-size: clamp(10px, 1.55vw, 24px);
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: 0.045em;
  color: var(--gold);
  white-space: nowrap;
}

/* Responsive adjustments for phones */
@media (max-width: 600px) {
  .counter {
    left: 23%;
    width: 69%;
    top: 25%;
    height: 43%;
  }

  .eyebrow {
    font-size: 1.7vw;
  }

  .timer {
    gap: 0.5vw;
  }

  .number {
    font-size: 4.8vw;
  }

  .separator {
    font-size: 4vw;
  }

  .unit-label {
    font-size: 1.5vw;
  }

  .exam-title {
    font-size: 3.8vw;
  }

  .motivation {
    font-size: 1.8vw;
  }
}
</style>
</head>

<body>

<div class="stage">
  <img
    class="background"
    src="./background.jpg"
    alt=""
  >

  <main class="counter">
    <p class="eyebrow">EXAM COUNTDOWN</p>

    <div class="timer" aria-label="Time remaining">
      <div class="unit">
        <span class="number" id="days">000</span>
        <span class="unit-label">DAYS</span>
      </div>

      <span class="separator">:</span>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="unit-label">HRS</span>
      </div>

      <span class="separator">:</span>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="unit-label">MIN</span>
      </div>

      <span class="separator">:</span>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="unit-label">SEC</span>
      </div>
    </div>

    <p class="exam-title">ICSE 2027</p>

    <p class="motivation">
      YOUR FUTURE IS BUILT TODAY
    </p>
  </main>
</div>

<script>
/*
  Target: 17 February 2027 at 12:00 PM local time.
  Provisional target, not official exam-date confirmation.
*/
const targetDate = new Date(2027, 1, 17, 12, 0, 0);

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

function updateCountdown() {
  const remaining = Math.max(
    0,
    targetDate.getTime() - Date.now()
  );

  const totalSeconds = Math.floor(remaining / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  daysEl.textContent = String(days).padStart(3, "0");
  hoursEl.textContent = String(hours).padStart(2, "0");
  minutesEl.textContent = String(minutes).padStart(2, "0");
  secondsEl.textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
