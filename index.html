
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICSE 2027 | Exam Countdown</title>

<style>
* { box-sizing: border-box; }

:root {
  --gold: #ffc66b;
  --bright: #ffe1a0;
  --dark: #080b0c;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: grid;
  place-items: center;
  color: var(--bright);
  background:
    radial-gradient(ellipse at 50% 50%, #28302b 0%, #111817 45%, #030505 100%);
  font-family: "Consolas", "Courier New", monospace;
}

.room {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background:
    linear-gradient(90deg, transparent 49.8%, #d29b4630 50%, transparent 50.2%),
    repeating-linear-gradient(0deg, transparent 0 79px, #dba74c0c 80px),
    repeating-linear-gradient(90deg, transparent 0 79px, #dba74c0c 80px);
  opacity: .8;
}

.room::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 10% 25%, #b98a4030, transparent 30%),
    radial-gradient(ellipse at 90% 80%, #b98a4020, transparent 30%),
    linear-gradient(180deg, #0009, transparent 45%, #000b);
}

.pipe {
  position: absolute;
  width: 22%;
  height: 5px;
  background: linear-gradient(90deg, transparent, #d9ad65, #30342f);
  box-shadow: 0 0 15px #d7a64a30;
}

.p1 { top: 13%; left: 5%; }
.p2 { top: 19%; right: 4%; width: 17%; }
.p3 { bottom: 15%; left: 10%; width: 15%; }
.p4 { bottom: 20%; right: 7%; }

.scene {
  position: relative;
  width: min(1100px, 92vw);
  padding: 18px;
  background: linear-gradient(135deg, #343a35, #0a0d0d 35%, #242923 75%, #080a09);
  border: 1px solid #8b754e;
  border-radius: 20px;
  box-shadow:
    0 0 0 5px #080a09,
    0 0 0 7px #4a4537,
    0 30px 100px #000,
    0 0 50px #dba74c20;
}

.scene::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid #d9ad6530;
  border-radius: 13px;
  pointer-events: none;
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 12px 17px;
  color: #b8a17a;
  font-size: clamp(9px, 1.4vw, 13px);
  letter-spacing: 2px;
}

.online { color: #e9bd70; }

.screen {
  position: relative;
  padding: clamp(22px, 5vw, 54px) 4%;
  overflow: hidden;
  text-align: center;
  background:
    radial-gradient(ellipse at center, #252a20 0%, #0a0d0b 72%);
  border: 2px solid #9d7940;
  border-radius: 12px;
  box-shadow:
    inset 0 0 35px #000,
    0 0 14px #dba74c20;
}

.screen::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid #b9914a45;
  pointer-events: none;
}

.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .22;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 15% 25%, #f3ce8c 1px, transparent 2px),
    radial-gradient(circle at 82% 30%, #f3ce8c 1px, transparent 2px),
    radial-gradient(circle at 70% 80%, #f3ce8c 1px, transparent 2px),
    linear-gradient(35deg, transparent 48%, #d2a04b50 49%, transparent 50%);
  background-size: 120px 100px, 150px 110px, 130px 90px, 170px 140px;
}

.content { position: relative; z-index: 1; }

.eyebrow {
  font-size: clamp(9px, 1.6vw, 15px);
  letter-spacing: 3px;
  color: #c7a46a;
  margin-bottom: 15px;
}

h1 {
  margin: 0;
  color: #f5dfb1;
  font-size: clamp(34px, 7vw, 78px);
  letter-spacing: 5px;
  text-shadow: 0 0 18px #e6b75a65;
}

h1 span {
  color: #e8b75d;
}

.subtitle {
  margin: 10px 0 35px;
  color: #b5a17f;
  font-size: clamp(10px, 2vw, 17px);
  letter-spacing: clamp(2px, .6vw, 6px);
}

.timer {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(5px, 2vw, 18px);
}

.unit {
  padding: clamp(10px, 2.5vw, 24px) 3px;
  border: 1px solid #8f6c37;
  border-radius: 7px;
  background: linear-gradient(145deg, #28271f, #090b09);
  box-shadow: inset 0 0 15px #c28c3310, 0 0 10px #c28c3310;
}

.number {
  display: block;
  color: #ffe1a0;
  font-size: clamp(21px, 5.5vw, 58px);
  font-weight: bold;
  line-height: 1.2;
  text-shadow: 0 0 13px #e6ad4b60;
  font-variant-numeric: tabular-nums;
}

.label {
  display: block;
  margin-top: 12px;
  color: #c9a56b;
  font-size: clamp(8px, 1.4vw, 13px);
  letter-spacing: 1px;
}

.status {
  margin-top: 30px;
  color: #e2bd7c;
  font-size: clamp(10px, 1.8vw, 16px);
  letter-spacing: clamp(2px, .5vw, 5px);
}

.bottom {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 30px;
  color: #a18a62;
  font-size: clamp(8px, 1.3vw, 12px);
  letter-spacing: 2px;
}

.line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, #c99a4d, transparent);
}

.footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 17px 12px 5px;
  color: #887b60;
  font-size: clamp(8px, 1.2vw, 11px);
  letter-spacing: 1px;
}

@media (max-width: 480px) {
  .scene { padding: 10px; }
  .screen { padding: 26px 3%; }
  .subtitle { margin-bottom: 22px; }
  .label { letter-spacing: 0; }
  .bottom { margin-top: 22px; }
}
</style>
</head>

<body>
<div class="room">
  <div class="pipe p1"></div>
  <div class="pipe p2"></div>
  <div class="pipe p3"></div>
  <div class="pipe p4"></div>
</div>

<main class="scene">
  <div class="topbar">
    <span>◈ EXAM COUNTDOWN SYSTEM</span>
    <span class="online">● ONLINE</span>
  </div>

  <section class="screen">
    <div class="content">
      <div class="eyebrow">◆ CLASS 10 · ICSE BOARD EXAMS ◆</div>
      <h1>ICSE <span>2027</span></h1>
      <div class="subtitle">THE FINAL COUNTDOWN</div>

      <div class="timer">
        <div class="unit">
          <span class="number" id="days">---</span>
          <span class="label">DAYS</span>
        </div>
        <div class="unit">
          <span class="number" id="hours">--</span>
          <span class="label">HRS</span>
        </div>
        <div class="unit">
          <span class="number" id="minutes">--</span>
          <span class="label">MIN</span>
        </div>
        <div class="unit">
          <span class="number" id="seconds">--</span>
          <span class="label">SEC</span>
        </div>
      </div>

      <div class="status" id="status">
        TIME REMAINING UNTIL EXAM
      </div>
      <div class="bottom">
        <div class="line"></div>
        <span>FOCUS · PREPARE · ACHIEVE</span>
        <div class="line"></div>
      </div>
    </div>
  </section>

  <div class="footer">
    <span>ICSE // 2027</span>
    <span>YOUR FUTURE STARTS HERE</span>
  </div>
</main>

<script>
// Provisional target: 17 February 2027, 11:00 AM local time.
// Update this when the official exam date is confirmed.
const EXAM_DATE = new Date(2027, 1, 17, 11, 0, 0);

function updateCountdown() {
  const remaining = EXAM_DATE.getTime() - Date.now();

  if (remaining <= 0) {
    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";
    document.getElementById("status").textContent =
      "YOUR EXAM COUNTDOWN HAS ENDED";
    return;
  }

  const totalSeconds = Math.floor(remaining / 1000);
  document.getElementById("days").textContent =
    Math.floor(totalSeconds / 86400).toString().padStart(3, "0");
  document.getElementById("hours").textContent =
    Math.floor((totalSeconds % 86400) / 3600).toString().padStart(2, "0");
  document.getElementById("minutes").textContent =
    Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, "0");
  document.getElementById("seconds").textContent =
    (totalSeconds % 60).toString().padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
