
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-B Exam Countdown</title>

<style>
:root {
    --gold: #e7b76b;
    --gold-light: #ffdda0;
    --white: #fffaf2;
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #071225 url("background.jpg") center center / cover no-repeat;
    color: var(--white);
    font-family: Georgia, "Times New Roman", serif;
}

/* Main countdown placement */
.countdown-panel {
    position: absolute;
    left: 56%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: min(1700px, 84vw);
    text-align: center;
    z-index: 2;
}

/* Decorative heading */
.heading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 36px;
}

.heading::before,
.heading::after {
    content: "";
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold));
    opacity: 0.9;
}

.heading::after {
    background: linear-gradient(90deg, var(--gold), transparent);
}

.heading span {
    color: var(--gold-light);
    font-size: clamp(15px, 1.6vw, 26px);
    font-weight: bold;
    letter-spacing: 4px;
    white-space: nowrap;
    text-shadow: 0 0 12px #dca75a55;
}

/* Compact countdown row */
.timer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(5px, 1.15vw, 22px);
    width: 100%;
}

.unit {
    flex: 1;
    min-width: 0;
    text-align: center;
}

.number {
    color: #fffdf9;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(36px, 5.1vw, 82px);
    font-weight: 700;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 14px #0008;
}

.label {
    margin-top: 10px;
    color: var(--gold-light);
    font-size: clamp(12px, 1.35vw, 23px);
    font-weight: bold;
    letter-spacing: 1.4px;
    text-shadow: 0 2px 8px #0009;
}

/* Gold separators */
.separator {
    align-self: flex-start;
    padding-top: 4px;
    color: var(--gold);
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(30px, 4.1vw, 65px);
    font-weight: 300;
    line-height: 1;
    opacity: 0.9;
    text-shadow: 0 0 12px #e7b76b44;
}

/* Smaller class heading */
.class-heading {
    margin-top: 42px;
    color: var(--gold-light);
    font-size: clamp(34px, 4vw, 62px);
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 2px 15px #0009;
}

/* Motivational line */
.motivation {
    margin-top: 15px;
    color: #fff0d6;
    font-size: clamp(14px, 1.5vw, 24px);
    font-style: italic;
    letter-spacing: 0.6px;
    text-shadow: 0 2px 10px #000b;
}

/* Translucent sound button */
.sound-button {
    position: fixed;
    top: 25px;
    right: 28px;
    z-index: 10;
    width: 48px;
    height: 48px;
    border: 1px solid #ffffff20;
    border-radius: 50%;
    background: #ffffff08;
    color: #f7d49b;
    font-size: 21px;
    cursor: pointer;
    opacity: 0.55;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    transition: opacity 0.25s, background 0.25s;
}

.sound-button:hover,
.sound-button:focus-visible {
    opacity: 0.9;
    background: #ffffff16;
}

/*
  Smooth contact glow.
  No rings, circles, borders, or ripple animations.
*/
.touch-glow {
    position: fixed;
    left: 0;
    top: 0;
    width: 1px;
    height: 1px;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(
        circle,
        rgba(255, 222, 157, 0.72) 0%,
        rgba(255, 190, 91, 0.42) 13%,
        rgba(239, 166, 66, 0.19) 32%,
        rgba(220, 155, 68, 0.07) 55%,
        rgba(220, 155, 68, 0) 75%
    );
    transform: translate(-50%, -50%);
    transition: opacity 0.35s ease;
    mix-blend-mode: screen;
}

.touch-glow.active {
    opacity: 1;
}

/* Adapt to smaller screens */
@media (max-width: 700px) {
    .countdown-panel {
        left: 50%;
        top: 45%;
        width: 94vw;
    }

    .heading {
        gap: 10px;
        margin-bottom: 24px;
    }

    .heading span {
        letter-spacing: 2px;
    }

    .timer {
        gap: 3px;
    }

    .number {
        font-size: clamp(25px, 7vw, 44px);
    }

    .label {
        font-size: clamp(9px, 2.3vw, 14px);
        letter-spacing: 0.4px;
        margin-top: 7px;
    }

    .separator {
        font-size: clamp(22px, 5.5vw, 35px);
    }

    .class-heading {
        margin-top: 30px;
        font-size: clamp(28px, 7vw, 42px);
    }

    .motivation {
        font-size: clamp(12px, 3vw, 17px);
        margin-top: 12px;
    }

    .sound-button {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
    }
}
</style>
</head>

<body>

<button
    class="sound-button"
    id="soundButton"
    aria-label="Turn ticking sound on or off"
    title="Toggle ticking sound"
>♩</button>

<div class="countdown-panel">

    <div class="heading">
        <span>EXAM COUNTDOWN</span>
    </div>

    <div class="timer" aria-label="Time remaining until the examination">

        <div class="unit">
            <div class="number" id="months">00</div>
            <div class="label">MONTHS</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="hours">00</div>
            <div class="label">HRS</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="minutes">00</div>
            <div class="label">MIN</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="seconds">00</div>
            <div class="label">SEC</div>
        </div>

    </div>

    <div class="class-heading">X-B</div>

    <div class="motivation">
        Every second counts. Every effort matters.
    </div>

</div>

<div class="touch-glow" id="touchGlow"></div>

<script>
/* Examination date: 17 February 2027, 9:00 AM IST.
   Change the time below if your official start time differs. */
const examDate = new Date("2027-02-17T09:00:00+05:30");

const $ = id => document.getElementById(id);

function pad(value) {
    return String(value).padStart(2, "0");
}

function updateCountdown() {
    const now = new Date();
    let remaining = examDate.getTime() - now.getTime();

    if (remaining <= 0) {
        ["months", "days", "hours", "minutes", "seconds"]
            .forEach(id => $(id).textContent = "00");
        return;
    }

    /*
      Calculate calendar months first, then the remaining
      days and clock time.
    */
    let cursor = new Date(now.getTime());
    let months = 0;

    while (months < 120) {
        const next = new Date(cursor.getTime());
        next.setMonth(next.getMonth() + 1);

        if (next.getTime() <= examDate.getTime() &&
            next.getTime() <= now.getTime() + remaining) {
            if (next.getTime() > examDate.getTime()) break;
            cursor = next;
            months++;
        } else {
            break;
        }
    }

    /*
      Use the current date plus calendar months as the
      starting point for the remaining countdown.
    */
    const monthCursor = new Date(now.getTime());
    const originalDay = monthCursor.getDate();

    for (let i = 0; i < months; i++) {
        const nextMonth = new Date(monthCursor.getTime());
        nextMonth.setDate(1);
        nextMonth.setMonth(nextMonth.getMonth() + 1);

        const lastDay = new Date(
            nextMonth.getFullYear(),
            nextMonth.getMonth() + 1,
            0
        ).getDate();

        nextMonth.setDate(Math.min(originalDay, lastDay));
        nextMonth.setHours(
            now.getHours(),
            now.getMinutes(),
            now.getSeconds(),
            now.getMilliseconds()
        );

        monthCursor.setTime(nextMonth.getTime());
    }

    /* Correct the calendar-month count for month-end dates. */
    let calendarMonths =
        (examDate.getFullYear() - now.getFullYear()) * 12 +
        examDate.getMonth() - now.getMonth();

    const anniversary = new Date(now.getTime());
    const day = anniversary.getDate();
    anniversary.setDate(1);
    anniversary.setMonth(anniversary.getMonth() + calendarMonths);

    const lastDay = new Date(
        anniversary.getFullYear(),
        anniversary.getMonth() + 1,
        0
    ).getDate();

    anniversary.setDate(Math.min(day, lastDay));
    anniversary.setHours(
        now.getHours(),
        now.getMinutes(),
        now.getSeconds(),
        now.getMilliseconds()
    );

    if (anniversary.getTime() > examDate.getTime()) {
        calendarMonths--;
    }

    const anchor = new Date(now.getTime());
    const anchorDay = anchor.getDate();
    anchor.setDate(1);
    anchor.setMonth(anchor.getMonth() + calendarMonths);

    const finalDay = new Date(
        anchor.getFullYear(),
        anchor.getMonth() + 1,
        0
    ).getDate();

    anchor.setDate(Math.min(anchorDay, finalDay));
    anchor.setHours(
        now.getHours(),
        now.getMinutes(),
        now.getSeconds(),
        now.getMilliseconds()
    );

    remaining = Math.max(0, examDate.getTime() - anchor.getTime());

    const days = Math.floor(remaining / 86400000);
    remaining %= 86400000;

    const hours = Math.floor(remaining / 3600000);
    remaining %= 3600000;

    const minutes = Math.floor(remaining / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);

    $("months").textContent = pad(Math.max(0, calendarMonths));
    $("days").textContent = pad(days);
    $("hours").textContent = pad(hours);
    $("minutes").textContent = pad(minutes);
    $("seconds").textContent = pad(seconds);
}

updateCountdown();
setInterval(updateCountdown, 1000);


/* Soft golden glow follows the mouse or finger.
   The glow is brightest at the contact point and
   fades smoothly outwards. Holding keeps it visible. */
const glow = $("touchGlow");

function moveGlow(x, y) {
    glow.style.left = x + "px";
    glow.style.top = y + "px";
    glow.style.width = "340px";
    glow.style.height = "340px";
}

function showGlow(x, y) {
    moveGlow(x, y);
    glow.classList.add("active");
}

function hideGlow() {
    glow.classList.remove("active");
}

document.addEventListener("pointerdown", event => {
    showGlow(event.clientX, event.clientY);
});

document.addEventListener("pointermove", event => {
    if (event.pointerType === "mouse" && event.buttons === 0) {
        return;
    }

    if (event.buttons > 0 || event.pointerType === "touch") {
        showGlow(event.clientX, event.clientY);
    }
});

document.addEventListener("pointerup", hideGlow);
document.addEventListener("pointercancel", hideGlow);
document.addEventListener("pointerleave", event => {
    if (event.pointerType === "mouse") hideGlow();
});


/* Optional gentle ticking sound.
   Browsers require a user click before audio can start. */
let audioContext = null;
let tickTimer = null;
let soundOn = false;

const soundButton = $("soundButton");

function playTick() {
    if (!audioContext || !soundOn) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 850;
    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.035, audioContext.currentTime + 0.008
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001, audioContext.currentTime + 0.055
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.06);
}

soundButton.addEventListener("click", async () => {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;
        audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    soundOn = !soundOn;

    if (soundOn) {
        soundButton.textContent = "♫";
        soundButton.style.opacity = "0.85";
        playTick();
        tickTimer = setInterval(playTick, 1000);
    } else {
        soundButton.textContent = "♩";
        soundButton.style.opacity = "0.55";
        clearInterval(tickTimer);
    }
});
</script>

</body>
</html>
