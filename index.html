
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11100c">
<title>ICSE 2027 Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #11100c;
  font-family: Arial, Helvetica, sans-serif;
}

/* Keep the full background image proportional */
.stage {
  position: absolute;
  width: min(100vw, 150vh);
  aspect-ratio: 3 / 2;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  container-type: inline-size;
  overflow: hidden;
  background: #11100c;
}

.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Counter position */
.counter {
  position: absolute;
  left: 23%;
  top: 25%;
  width: 65%;
  height: 43%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 1%;
  color: #f4c95d;
}

/* Heading */
.eyebrow {
  margin: 0 0 2%;
  font-size: 1.65cqw;
  font-weight: 700;
  letter-spacing: 0.22em;
  white-space: nowrap;
  color: #f4c95d;
}

/* Countdown numbers */
.timer {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 0.55cqw;
  width: 100%;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.number {
  font-size: 5.6cqw;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -0.035em;
  color: #ffe7a6;
  text-shadow: 0 0 10px rgba(244, 201, 93, 0.3);
}

.separator {
  font-size: 4.8cqw;
  font-weight: 600;
  line-height: 1;
  color: #f4c95d;
  margin-top: 0.1cqw;
}

.unit-label {
  margin-top: 0.7cqw;
  font-size: 1.5cqw;
  letter-spacing: 0.12em;
  color: #f4c95d;
}

/* Exam title */
.exam-title {
  margin: 3% 0 0;
  font-size: 4.2cqw;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: 0.025em;
  color: #ffe3a0;
  white-space: nowrap;
}

/* Motivational message */
.motivation {
  margin: 1.5% 0 0;
  font-size: 1.9cqw;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: 0.035em;
  color: #f4c95d;
  white-space: nowrap;
}

/* Sound control */
.sound-button {
  position: fixed;
  z-index: 5;
  right: 12px;
  bottom: 16px;
  padding: 10px 15px;
  border: 1px solid #c59b40;
  border-radius: 24px;
  background: #17140d;
  color: #ffe3a0;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 12px #0008;
}

.sound-button:active {
  background: #3a2c12;
}

@media (max-width: 480px) {
  .counter {
    left: 21%;
    width: 69%;
    top: 25%;
  }

  .timer {
    gap: 0.45cqw;
  }

  .number {
    font-size: 5.4cqw;
  }

  .separator {
    font-size: 4.6cqw;
  }

  .eyebrow {
    font-size: 1.7cqw;
  }

  .unit-label {
    font-size: 1.55cqw;
  }

  .exam-title {
    font-size: 4.1cqw;
  }

  .motivation {
    font-size: 1.8cqw;
  }
}
</style>
</head>

<body>

<div class="stage">
  <img class="background" src="./background.jpg" alt="">

  <main class="counter">
    <p class="eyebrow">EXAM COUNTDOWN</p>

    <div class="timer" aria-label="Time remaining">
      <div class="unit">
        <span class="number" id="days">000</span>
        <span class="unit-label">DAYS</span>
      </div>

      <span class="separator">:</span>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="unit-label">HRS</span>
      </div>

      <span class="separator">:</span>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="unit-label">MIN</span>
      </div>

      <span class="separator">:</span>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="unit-label">SEC</span>
      </div>
    </div>

    <p class="exam-title">ICSE 2027</p>
    <p class="motivation">YOUR FUTURE IS BUILT TODAY</p>
  </main>
</div>

<button class="sound-button" id="soundButton"
        type="button" aria-pressed="false">
  ♫ Sound: Off
</button>

<script>
/* Target: 17 February 2027 at 12:00 PM local time.
   Provisional date, not official exam-date confirmation. */
const targetDate = new Date(2027, 1, 17, 12, 0, 0);

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

function updateCountdown() {
  const remaining = Math.max(
    0,
    targetDate.getTime() - Date.now()
  );

  const totalSeconds = Math.floor(remaining / 1000);

  daysEl.textContent =
    String(Math.floor(totalSeconds / 86400)).padStart(3, "0");

  hoursEl.textContent =
    String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, "0");

  minutesEl.textContent =
    String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");

  secondsEl.textContent =
    String(totalSeconds % 60).padStart(2, "0");
}

/* Optional soft electronic clock tick */
const soundButton = document.getElementById("soundButton");
let soundOn = false;
let audioContext = null;
let tickInterval = null;

function playTick() {
  if (!soundOn || !audioContext) return;

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(
    850, audioContext.currentTime
  );

  gain.gain.setValueAtTime(
    0.0001, audioContext.currentTime
  );
  gain.gain.exponentialRampToValueAtTime(
    0.035, audioContext.currentTime + 0.01
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001, audioContext.currentTime + 0.07
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.08);
}

soundButton.addEventListener("click", async () => {
  if (!audioContext) {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      soundButton.textContent = "Sound unsupported";
      return;
    }

    audioContext = new AudioContextClass();
  }

  if (soundOn) {
    soundOn = false;
    clearInterval(tickInterval);
    tickInterval = null;
    soundButton.textContent = "♫ Sound: Off";
    soundButton.setAttribute("aria-pressed", "false");
  } else {
    await audioContext.resume();
    soundOn = true;
    playTick();

    tickInterval = setInterval(playTick, 1000);
    soundButton.textContent = "♫ Sound: On";
    soundButton.setAttribute("aria-pressed", "true");
  }
});

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
