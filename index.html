
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050707">
<title>ICSE 2027 Countdown</title>

<style>
:root {
  --screen-left: 35%;
  --screen-top: 36%;
  --screen-width: 46%;
  --screen-height: 27%;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #050707;
  font-family: Arial, sans-serif;
}

.scene {
  position: fixed;
  inset: 0;
  background: #050707 url("./background.jpg")
    center center / contain no-repeat;
}

/* Main display placement */
.display-content {
  position: fixed;
  left: var(--screen-left);
  top: var(--screen-top);
  width: var(--screen-width);
  height: var(--screen-height);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: visible;
  padding: 1%;

  color: #ffd18a;
  text-shadow: 0 0 5px rgba(255, 176, 70, 0.7);
}

/* Keep the top heading's appearance unchanged */
.eyebrow {
  margin: 0 0 5px;
  font-size: clamp(7px, 1.05vw, 17px);
  font-weight: bold;
  letter-spacing: 0.2em;
  white-space: nowrap;

  transform: rotate(-3deg);
  transform-origin: center;
}

/* Bigger countdown numbers */
.timer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(2px, 0.5vw, 8px);
  width: 100%;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.value {
  font-size: clamp(17px, 3.5vw, 54px);
  font-weight: 700;
  line-height: 1.05;
}

.separator {
  font-size: clamp(15px, 2.8vw, 42px);
  font-weight: 500;
  line-height: 1;
  margin-top: -0.12em;
}

/* Straighten the bottom two lines */
.headline {
  margin: 8px 0 0;
  font-size: clamp(12px, 2.1vw, 32px);
  font-weight: bold;
  white-space: nowrap;

  transform: none;
  letter-spacing: 0.02em;
}

.subline {
  margin: 5px 0 0;
  font-size: clamp(7px, 1.3vw, 20px);
  white-space: nowrap;

  transform: none;
  letter-spacing: 0;
}

@media (max-aspect-ratio: 4/3) {
  .scene {
    background-size: 100% auto;
  }
}
</style>
</head>

<body>
<div class="scene"></div>

<main class="display-content">
  <p class="eyebrow">EXAM COUNTDOWN</p>

  <div class="timer">
    <span class="value" id="days">000</span>
    <span class="separator">:</span>
    <span class="value" id="hours">00</span>
    <span class="separator">:</span>
    <span class="value" id="minutes">00</span>
    <span class="separator">:</span>
    <span class="value" id="seconds">00</span>
  </div>

  <p class="headline">ICSE 2027</p>
  <p class="subline">COUNTING DOWN TO EXAM DAY</p>
</main>

<script>
/* Target: 17 February 2027 at 12:00 PM local time.
   This is a provisional date, not a confirmed official exam date. */
const targetDate = new Date(2027, 1, 17, 12, 0, 0);

function updateCountdown() {
  const remaining = Math.max(
    0,
    targetDate.getTime() - Date.now()
  );

  const totalSeconds = Math.floor(remaining / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  document.getElementById("days").textContent =
    String(days).padStart(3, "0");

  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
