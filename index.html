
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ICSE 2027 Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  font-family: Arial, Helvetica, sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #080808;
}

.scene {
  position: relative;
  width: min(100vw, 177.7778vh);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #080808;
}

.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

.overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.heading {
  fill: #f5c65b;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 6px;
  text-anchor: middle;
}

.number {
  fill: #ffe7ac;
  font-size: 76px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  text-anchor: middle;
  filter: url(#goldGlow);
}

.label {
  fill: #f3c65c;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 2px;
  text-anchor: middle;
}

.colon {
  fill: #d9ad4b;
  font-size: 38px;
  text-anchor: middle;
}

.exam {
  fill: #ffe8b0;
  font-size: 37px;
  font-weight: 800;
  letter-spacing: 3px;
  text-anchor: middle;
}

.quote {
  fill: #f3c65c;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 1px;
  text-anchor: middle;
}

@media (max-width: 600px) {
  .heading {
    font-size: 25px;
  }

  .number {
    font-size: 76px;
  }

  .label {
    font-size: 19px;
  }

  .exam {
    font-size: 36px;
  }

  .quote {
    font-size: 20px;
  }
}
</style>
</head>

<body>
<div class="stage">
  <div class="scene">

    <img
      class="background"
      src="./background.jpg"
      alt="Black and gold background"
    >

    <svg
      class="overlay"
      viewBox="0 0 1600 900"
      preserveAspectRatio="none"
      aria-label="ICSE 2027 countdown"
    >
      <defs>
        <filter id="goldGlow"
          x="-20%" y="-30%"
          width="140%" height="160%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <path id="headingPath"
          d="M 400 330 Q 800 285 1200 330"/>

        <path id="quotePath"
          d="M 420 630 Q 800 660 1180 630"/>
      </defs>

      <!-- Curved heading -->
      <text class="heading">
        <textPath href="#headingPath" startOffset="50%">
          EXAM COUNTDOWN
        </textPath>
      </text>

      <!-- DAYS -->
      <text id="days" class="number"
        x="370" y="432">000</text>
      <text class="label"
        x="370" y="470">DAYS</text>

      <!-- HOURS -->
      <text id="hours" class="number"
        x="655" y="397">00</text>
      <text class="label"
        x="655" y="435">HRS</text>

      <!-- MINUTES -->
      <text id="minutes" class="number"
        x="945" y="397">00</text>
      <text class="label"
        x="945" y="435">MIN</text>

      <!-- SECONDS -->
      <text id="seconds" class="number"
        x="1230" y="432">00</text>
      <text class="label"
        x="1230" y="470">SEC</text>

      <!-- Separators centred in the gaps -->
      <text class="colon"
        x="512" y="414">:</text>

      <text class="colon"
        x="800" y="379">:</text>

      <text class="colon"
        x="1088" y="414">:</text>

      <!-- Exam title -->
      <text class="exam" x="800" y="555">
        ICSE 2027
      </text>

      <!-- Motivational quote -->
      <text class="quote">
        <textPath href="#quotePath" startOffset="50%">
          SMALL STEPS TODAY. BIG RESULTS TOMORROW.
        </textPath>
      </text>
    </svg>
  </div>
</div>

<script>
/* 17 February 2027, 12:00 PM local time.
   Confirm the official exam date before relying on it. */
const examDate = new Date(2027, 1, 17, 12, 0, 0);

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

function updateCountdown() {
  const remaining = Math.max(
    0,
    examDate.getTime() - Date.now()
  );

  const total = Math.floor(remaining / 1000);

  const days = Math.floor(total / 86400);
  const hours = Math.floor((total % 86400) / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;

  daysEl.textContent = String(days).padStart(3, "0");
  hoursEl.textContent = String(hours).padStart(2, "0");
  minutesEl.textContent = String(minutes).padStart(2, "0");
  secondsEl.textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
