
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-B Exam Countdown</title>

<style>
:root {
    --gold: #ffd34d;
    --gold-light: #fff0b5;
    --gold-dark: #b98719;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #100e0a;
}

body {
    color: var(--gold-light);
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

/* BACKGROUND IMAGE */
#wallpaper {
    position: fixed;
    inset: 0;
    background: url("background.jpg") center center / cover no-repeat;
}

/* COUNTDOWN POSITION AND BACKDROP */
.countdown-area {
    position: absolute;
    left: 56%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: min(1500px, 72vw);
    padding: clamp(20px, 2.4vw, 48px) clamp(12px, 2vw, 36px);
    text-align: center;

    background: radial-gradient(
        ellipse at center,
        rgba(15, 13, 9, 0.91) 0%,
        rgba(15, 13, 9, 0.78) 55%,
        rgba(15, 13, 9, 0.42) 75%,
        transparent 100%
    );
}

/* EXAM COUNTDOWN TITLE */
.eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 1.8vw, 38px);
    margin-bottom: clamp(22px, 2.4vw, 48px);
    color: var(--gold);
    font-size: clamp(14px, 1.35vw, 30px);
    letter-spacing: 0.32em;
    white-space: nowrap;
    text-shadow: 0 0 14px rgba(255, 196, 49, 0.2);
}

.eyebrow::before,
.eyebrow::after {
    content: "";
    display: block;
    width: 18%;
    max-width: 250px;
    height: 2px;
    flex: 0 1 250px;
    background: var(--gold-dark);
}

/* FIVE COUNTDOWN UNITS */
.timer {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: start;
    gap: clamp(5px, 0.8vw, 18px);
    width: 100%;
}

.unit {
    min-width: 0;
}

.number {
    color: var(--gold-light);
    font-size: clamp(26px, 4.05vw, 82px);
    font-weight: 750;
    line-height: 1.1;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;

    text-shadow:
        0 0 5px rgba(255, 211, 77, 0.48),
        0 0 18px rgba(255, 174, 32, 0.24);
}

.label {
    margin-top: clamp(8px, 0.8vw, 18px);
    color: var(--gold);
    font-size: clamp(10px, 1.15vw, 23px);
    letter-spacing: 0.14em;
    white-space: nowrap;
}

/* X-B HEADING */
.class-name {
    margin-top: clamp(25px, 2.6vw, 54px);
    color: var(--gold);
    font-size: clamp(38px, 3.8vw, 76px);
    font-weight: 750;
    line-height: 1.1;
    letter-spacing: 0.09em;
    text-shadow: 0 0 18px rgba(255, 183, 30, 0.22);
}

.subtitle {
    margin-top: clamp(10px, 1vw, 22px);
    color: #f6ca55;
    font-size: clamp(11px, 1.25vw, 25px);
    letter-spacing: 0.19em;
    white-space: nowrap;
}

/* TRANSPARENT SOUND BUTTON */
#soundButton {
    position: fixed;
    top: 22px;
    right: 24px;
    z-index: 50;

    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;

    border: 1px solid rgba(255, 211, 77, 0.48);
    border-radius: 50%;
    color: var(--gold);
    background: rgba(20, 17, 12, 0.32);

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    cursor: pointer;

    transition:
        background 180ms,
        border-color 180ms,
        transform 180ms;
}

#soundButton:hover {
    background: rgba(255, 194, 47, 0.15);
    border-color: var(--gold);
    transform: scale(1.06);
}

#soundButton:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: 4px;
}

#soundButton svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* GOLDEN TOUCH RIPPLE */
.gold-ripple {
    position: fixed;
    z-index: 40;
    width: 20px;
    height: 20px;

    border: 2px solid rgba(255, 216, 99, 0.96);
    border-radius: 50%;
    pointer-events: none;

    transform: translate(-50%, -50%) scale(0.2);

    background: radial-gradient(
        circle,
        rgba(255, 201, 58, 0.34),
        rgba(255, 187, 30, 0.1) 45%,
        transparent 72%
    );

    box-shadow:
        0 0 12px rgba(255, 199, 53, 0.58),
        0 0 28px rgba(255, 180, 25, 0.25);

    animation: ripple 850ms ease-out forwards;
}

@keyframes ripple {
    0% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.2);
    }

    60% {
        opacity: 0.65;
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(7);
    }
}

/* RESPONSIVE LAYOUT */
@media (max-width: 900px) {
    .countdown-area {
        left: 56%;
        width: 86vw;
        padding: 22px 8px;
    }

    .eyebrow {
        gap: 9px;
        letter-spacing: 0.17em;
        margin-bottom: 20px;
    }

    .timer {
        gap: 3px;
    }

    .number {
        font-size: clamp(19px, 5.2vw, 42px);
    }

    .label {
        font-size: clamp(8px, 1.8vw, 14px);
        letter-spacing: 0.05em;
        margin-top: 8px;
    }

    .class-name {
        margin-top: 25px;
    }

    .subtitle {
        letter-spacing: 0.08em;
    }

    #soundButton {
        top: 12px;
        right: 12px;
        width: 42px;
        height: 42px;
    }
}

@media (max-width: 480px) {
    .countdown-area {
        left: 56%;
        width: 91vw;
    }

    .eyebrow {
        font-size: 11px;
        gap: 6px;
    }

    .number {
        font-size: clamp(16px, 4.8vw, 24px);
    }

    .label {
        font-size: 7px;
    }

    .subtitle {
        font-size: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .gold-ripple {
        animation-duration: 500ms;
    }
}
</style>
</head>

<body>

<div id="wallpaper">

    <main class="countdown-area">

        <div class="eyebrow">EXAM COUNTDOWN</div>

        <div class="timer">

            <div class="unit">
                <div class="number" id="months">00</div>
                <div class="label">MONTHS</div>
            </div>

            <div class="unit">
                <div class="number" id="days">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="unit">
                <div class="number" id="hours">00</div>
                <div class="label">HRS</div>
            </div>

            <div class="unit">
                <div class="number" id="minutes">00</div>
                <div class="label">MIN</div>
            </div>

            <div class="unit">
                <div class="number" id="seconds">00</div>
                <div class="label">SEC</div>
            </div>

        </div>

        <div class="class-name">X-B</div>

        <div class="subtitle" id="subtitle">
            COUNTING DOWN TO EXAM DAY
        </div>

    </main>

</div>

<!-- SOUND BUTTON -->
<button id="soundButton"
        type="button"
        aria-label="Turn ticking sound on"
        title="Turn ticking sound on">

    <svg id="soundIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
        <path d="M16 9a5 5 0 0 1 0 6"/>
        <path d="M19 6a9 9 0 0 1 0 12"/>
    </svg>

</button>

<script>

/* =========================================
   COUNTDOWN SETTINGS
   17 February 2027, 9:00 AM IST
   ========================================= */

const targetDate = new Date("2027-02-17T09:00:00+05:30");

const output = {
    months: document.getElementById("months"),
    days: document.getElementById("days"),
    hours: document.getElementById("hours"),
    minutes: document.getElementById("minutes"),
    seconds: document.getElementById("seconds")
};

const pad = number => String(number).padStart(2, "0");

/* Add calendar months without overflowing short months */
function addCalendarMonths(date, count) {
    const result = new Date(date);
    const originalDay = result.getDate();

    result.setDate(1);
    result.setMonth(result.getMonth() + count);

    const lastDay = new Date(
        result.getFullYear(),
        result.getMonth() + 1,
        0
    ).getDate();

    result.setDate(Math.min(originalDay, lastDay));

    return result;
}

/* Update months, days, hours, minutes and seconds */
function updateCountdown() {
    const now = new Date();

    if (now >= targetDate) {
        Object.values(output).forEach(element => {
            element.textContent = "00";
        });

        document.getElementById("subtitle").textContent =
            "YOUR EXAM DAY IS HERE";

        return;
    }

    let months =
        (targetDate.getFullYear() - now.getFullYear()) * 12
        + targetDate.getMonth() - now.getMonth();

    let anchor = addCalendarMonths(now, months);

    if (anchor > targetDate) {
        months--;
        anchor = addCalendarMonths(now, months);
    }

    let remaining = targetDate.getTime() - anchor.getTime();

    const DAY = 86400000;
    const HOUR = 3600000;
    const MINUTE = 60000;

    const days = Math.floor(remaining / DAY);
    remaining -= days * DAY;

    const hours = Math.floor(remaining / HOUR);
    remaining -= hours * HOUR;

    const minutes = Math.floor(remaining / MINUTE);
    remaining -= minutes * MINUTE;

    const seconds = Math.floor(remaining / 1000);

    output.months.textContent = pad(months);
    output.days.textContent = pad(days);
    output.hours.textContent = pad(hours);
    output.minutes.textContent = pad(minutes);
    output.seconds.textContent = pad(seconds);
}

updateCountdown();
setInterval(updateCountdown, 250);


/* =========================================
   SOOTHING SYNTHETIC TICKING SOUND
   No separate audio file required
   ========================================= */

const soundButton = document.getElementById("soundButton");
const soundIcon = document.getElementById("soundIcon");

let soundEnabled = false;
let audioContext = null;
let tickTimer = null;

function playTick() {
    if (!soundEnabled || !audioContext) return;

    const now = audioContext.currentTime;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(1500, now);
    oscillator.frequency.exponentialRampToValueAtTime(
        900,
        now + 0.025
    );

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(
        0.045,
        now + 0.003
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.05
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.055);
}

function updateSoundIcon() {
    if (soundEnabled) {
        soundButton.setAttribute(
            "aria-label",
            "Turn ticking sound off"
        );

        soundButton.title = "Turn ticking sound off";

        soundIcon.innerHTML = `
            <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
            <path d="M16 9a5 5 0 0 1 0 6"/>
            <path d="M19 6a9 9 0 0 1 0 12"/>
        `;
    } else {
        soundButton.setAttribute(
            "aria-label",
            "Turn ticking sound on"
        );

        soundButton.title = "Turn ticking sound on";

        soundIcon.innerHTML = `
            <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
            <path d="m16 9 5 6"/>
            <path d="m21 9-5 6"/>
        `;
    }
}

soundButton.addEventListener("click", async () => {

    if (soundEnabled) {
        soundEnabled = false;

        clearInterval(tickTimer);
        tickTimer = null;

        updateSoundIcon();
        return;
    }

    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
        soundButton.title = "Audio is not supported in this browser";
        return;
    }

    if (!audioContext) {
        audioContext = new AudioContextClass();
    }

    try {
        await audioContext.resume();

        soundEnabled = true;
        updateSoundIcon();

        playTick();
        tickTimer = setInterval(playTick, 1000);

    } catch (error) {
        soundEnabled = false;
        updateSoundIcon();
    }
});


/* =========================================
   GOLDEN TOUCH / CLICK RIPPLE
   ========================================= */

function createRipple(x, y) {
    const ripple = document.createElement("span");

    ripple.className = "gold-ripple";
    ripple.style.left = x + "px";
    ripple.style.top = y + "px";

    document.body.appendChild(ripple);

    ripple.addEventListener(
        "animationend",
        () => ripple.remove(),
        { once: true }
    );
}

document.addEventListener("pointerdown", event => {

    // Avoid the ripple when clicking the sound button.
    if (event.target.closest("#soundButton")) return;

    createRipple(event.clientX, event.clientY);
});

</script>

</body>
</html>
