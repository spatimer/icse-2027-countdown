
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>X-B Exam Countdown</title>

<style>
:root {
    --gold: #ffd34d;
    --gold-soft: #fff0b5;
    --gold-dark: #b98719;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #100e0a;
}

body {
    color: var(--gold-soft);
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#wallpaper {
    position: fixed;
    inset: 0;
    background: url("background.jpg") center center / cover no-repeat;
    touch-action: none;
}

/* Original countdown placement */
.countdown-area {
    position: absolute;
    left: 56%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: min(1500px, 72vw);
    padding: clamp(20px, 2.4vw, 48px) clamp(12px, 2vw, 36px);
    text-align: center;
    background: radial-gradient(
        ellipse at center,
        rgba(15,13,9,.91) 0%,
        rgba(15,13,9,.78) 55%,
        rgba(15,13,9,.42) 75%,
        transparent 100%
    );
}

.eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 1.8vw, 38px);
    margin-bottom: clamp(22px, 2.4vw, 48px);
    color: var(--gold);
    font-size: clamp(14px, 1.35vw, 30px);
    letter-spacing: .32em;
    white-space: nowrap;
    text-shadow: 0 0 14px rgba(255,196,49,.2);
}

.eyebrow:before,
.eyebrow:after {
    content: "";
    display: block;
    width: 18%;
    max-width: 250px;
    height: 2px;
    flex: 0 1 250px;
    background: var(--gold-dark);
}

.timer {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: start;
    gap: clamp(5px, .8vw, 18px);
    width: 100%;
}

.unit {
    min-width: 0;
}

.number {
    color: var(--gold-soft);
    font-size: clamp(26px, 4.05vw, 82px);
    font-weight: 750;
    line-height: 1.1;
    letter-spacing: -.035em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-shadow:
        0 0 5px rgba(255,211,77,.48),
        0 0 18px rgba(255,174,32,.24);
}

.label {
    margin-top: clamp(8px, .8vw, 18px);
    color: var(--gold);
    font-size: clamp(10px, 1.15vw, 23px);
    letter-spacing: .14em;
    white-space: nowrap;
}

.class-name {
    margin-top: clamp(25px, 2.6vw, 54px);
    color: var(--gold);
    font-size: clamp(38px, 3.8vw, 76px);
    font-weight: 750;
    line-height: 1.1;
    letter-spacing: .09em;
    text-shadow: 0 0 18px rgba(255,183,30,.22);
}

.subtitle {
    margin-top: clamp(10px, 1vw, 22px);
    color: #f6ca55;
    font-size: clamp(11px, 1.25vw, 25px);
    letter-spacing: .19em;
    white-space: nowrap;
}

/* Original sound button */
#soundButton {
    position: fixed;
    top: 22px;
    right: 24px;
    z-index: 10000;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 1px solid rgba(255,211,77,.48);
    border-radius: 50%;
    color: var(--gold);
    background: rgba(20,17,12,.32);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    cursor: pointer;
    transition: background 180ms, border-color 180ms, transform 180ms;
    touch-action: manipulation;
}

#soundButton:hover {
    background: rgba(255,194,47,.15);
    border-color: var(--gold);
    transform: scale(1.06);
}

#soundButton:focus-visible {
    outline: 2px solid var(--gold-soft);
    outline-offset: 4px;
}

#soundButton svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Independent golden glow for every active pointer */
.touch-glow {
    position: fixed;
    z-index: 9000;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    background: radial-gradient(
        circle,
        rgba(255, 210, 75, .34) 0%,
        rgba(255, 190, 45, .23) 18%,
        rgba(255, 174, 25, .12) 42%,
        rgba(255, 160, 20, .045) 62%,
        transparent 75%
    );
    filter: blur(5px);
    mix-blend-mode: screen;
    will-change: left, top;
}

/* Subtle glowing centre */
.touch-glow::after {
    content: "";
    position: absolute;
    inset: 42%;
    border-radius: 50%;
    background: rgba(255, 220, 110, .55);
    box-shadow:
        0 0 12px 5px rgba(255, 202, 65, .38),
        0 0 28px 12px rgba(255, 177, 35, .20);
}

/* W image popup */
#popup-image {
    position: fixed;
    z-index: 9500;
    left: 60%;
    top: 44%;
    width: min(420px, 48vw);
    height: 210px;
    object-fit: contain;
    transform: translate(-50%, -50%) scale(.96);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
}

#popup-image.show {
    visibility: visible;
    animation: popupAppear 3s ease-in-out forwards;
}

@keyframes popupAppear {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.96);
    }
    12% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    82% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.98);
    }
}

@media(max-width: 900px) {
    .countdown-area {
        left: 56%;
        width: 86vw;
        padding: 22px 8px;
    }

    .eyebrow {
        gap: 9px;
        letter-spacing: .17em;
        margin-bottom: 20px;
    }

    .timer {
        gap: 3px;
    }

    .number {
        font-size: clamp(19px, 5.2vw, 42px);
    }

    .label {
        font-size: clamp(8px, 1.8vw, 14px);
        letter-spacing: .05em;
        margin-top: 8px;
    }

    .class-name {
        margin-top: 25px;
    }

    .subtitle {
        letter-spacing: .08em;
    }

    #soundButton {
        top: 12px;
        right: 12px;
        width: 42px;
        height: 42px;
    }

    .touch-glow {
        width: 150px;
        height: 150px;
    }

    #popup-image {
        left: 50%;
        top: 45%;
        width: 76vw;
        height: 150px;
    }
}

@media(max-width: 480px) {
    .countdown-area {
        left: 56%;
        width: 91vw;
    }

    .eyebrow {
        font-size: 11px;
        gap: 6px;
    }

    .number {
        font-size: clamp(16px, 4.8vw, 24px);
    }

    .label {
        font-size: 7px;
    }

    .subtitle {
        font-size: 9px;
    }
}

@media(prefers-reduced-motion: reduce) {
    #popup-image.show {
        animation-duration: 3s;
    }
}
</style>
</head>

<body>
<div id="wallpaper">
    <main class="countdown-area">
        <div class="eyebrow">EXAM COUNTDOWN</div>

        <div class="timer">
            <div class="unit">
                <div class="number" id="months">00</div>
                <div class="label">MONTHS</div>
            </div>

            <div class="unit">
                <div class="number" id="days">00</div>
                <div class="label">DAYS</div>
            </div>

            <div class="unit">
                <div class="number" id="hours">00</div>
                <div class="label">HRS</div>
            </div>

            <div class="unit">
                <div class="number" id="minutes">00</div>
                <div class="label">MIN</div>
            </div>

            <div class="unit">
                <div class="number" id="seconds">00</div>
                <div class="label">SEC</div>
            </div>
        </div>

        <div class="class-name">X-B</div>
        <div class="subtitle" id="subtitle">COUNTING DOWN TO EXAM DAY</div>
    </main>
</div>

<button id="soundButton" type="button"
        aria-label="Turn ticking sound on"
        title="Turn ticking sound on">
    <svg id="soundIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
        <path d="M16 9a5 5 0 0 1 0 6"/>
        <path d="M19 6a9 9 0 0 1 0 12"/>
    </svg>
</button>

<img id="popup-image" src="popup.png" alt="" aria-hidden="true">

<script>
/* =========================================
   COUNTDOWN
   Target: 17 February 2027 at 9:00 AM IST
========================================= */

const targetDate = new Date("2027-02-17T09:00:00+05:30");

const output = {
    months: document.getElementById("months"),
    days: document.getElementById("days"),
    hours: document.getElementById("hours"),
    minutes: document.getElementById("minutes"),
    seconds: document.getElementById("seconds")
};

const pad = number => String(number).padStart(2, "0");

function addCalendarMonths(date, count) {
    const result = new Date(date);
    const day = result.getDate();

    result.setDate(1);
    result.setMonth(result.getMonth() + count);

    const lastDay = new Date(
        result.getFullYear(),
        result.getMonth() + 1,
        0
    ).getDate();

    result.setDate(Math.min(day, lastDay));
    return result;
}

function updateCountdown() {
    const now = new Date();

    if (now >= targetDate) {
        Object.values(output).forEach(element => {
            element.textContent = "00";
        });

        document.getElementById("subtitle").textContent =
            "YOUR EXAM DAY IS HERE";

        return;
    }

    let months =
        (targetDate.getFullYear() - now.getFullYear()) * 12 +
        targetDate.getMonth() - now.getMonth();

    let anchor = addCalendarMonths(now, months);

    if (anchor > targetDate) {
        months--;
        anchor = addCalendarMonths(now, months);
    }

    let remaining = targetDate.getTime() - anchor.getTime();

    const dayMs = 86400000;
    const hourMs = 3600000;
    const minuteMs = 60000;

    const days = Math.floor(remaining / dayMs);
    remaining -= days * dayMs;

    const hours = Math.floor(remaining / hourMs);
    remaining -= hours * hourMs;

    const minutes = Math.floor(remaining / minuteMs);
    remaining -= minutes * minuteMs;

    const seconds = Math.floor(remaining / 1000);

    output.months.textContent = pad(months);
    output.days.textContent = pad(days);
    output.hours.textContent = pad(hours);
    output.minutes.textContent = pad(minutes);
    output.seconds.textContent = pad(seconds);
}

updateCountdown();
setInterval(updateCountdown, 250);


/* =========================================
   TICKING SOUND
========================================= */

const soundButton = document.getElementById("soundButton");
const soundIcon = document.getElementById("soundIcon");

let soundEnabled = false;
let audioContext = null;
let tickTimer = null;

function playTick() {
    if (!soundEnabled || !audioContext) return;

    const now = audioContext.currentTime;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(1500, now);
    oscillator.frequency.exponentialRampToValueAtTime(900, now + 0.025);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.045, now + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.055);
}

function setSoundIcon() {
    if (soundEnabled) {
        soundButton.setAttribute("aria-label", "Turn ticking sound off");
        soundButton.title = "Turn ticking sound off";

        soundIcon.innerHTML =
            '<path d="M11 5 6 9H3v6h3l5 4V5Z"/>' +
            '<path d="M16 9a5 5 0 0 1 0 6"/>' +
            '<path d="M19 6a9 9 0 0 1 0 12"/>';
    } else {
        soundButton.setAttribute("aria-label", "Turn ticking sound on");
        soundButton.title = "Turn ticking sound on";

        soundIcon.innerHTML =
            '<path d="M11 5 6 9H3v6h3l5 4V5Z"/>' +
            '<path d="m16 9 5 6"/>' +
            '<path d="m21 9-5 6"/>';
    }
}

soundButton.addEventListener("click", async () => {
    if (soundEnabled) {
        soundEnabled = false;
        clearInterval(tickTimer);
        tickTimer = null;
        setSoundIcon();
        return;
    }

    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
        soundButton.title = "Audio is not supported in this browser";
        return;
    }

    if (!audioContext) {
        audioContext = new AudioContextClass();
    }

    try {
        await audioContext.resume();

        soundEnabled = true;
        setSoundIcon();
        playTick();

        tickTimer = setInterval(playTick, 1000);
    } catch (error) {
        soundEnabled = false;
        setSoundIcon();
    }
});


/* =========================================
   MULTI-TOUCH GOLDEN GLOWS
   Each active pointer gets its own glow.
========================================= */

const activeGlows = new Map();

function createGlow(pointerId, x, y) {
    const glow = document.createElement("div");
    glow.className = "touch-glow";

    glow.style.left = x + "px";
    glow.style.top = y + "px";

    document.body.appendChild(glow);
    activeGlows.set(pointerId, glow);
}

function moveGlow(pointerId, x, y) {
    const glow = activeGlows.get(pointerId);

    if (!glow) return;

    glow.style.left = x + "px";
    glow.style.top = y + "px";
}

function removeGlow(pointerId) {
    const glow = activeGlows.get(pointerId);

    if (glow) {
        glow.remove();
        activeGlows.delete(pointerId);
    }
}

function removeAllGlows() {
    for (const glow of activeGlows.values()) {
        glow.remove();
    }

    activeGlows.clear();
}

/*
 * Touch and pen:
 * Each pointer gets an independent glow.
 *
 * Mouse:
 * Only the left mouse button activates a glow.
 * Moving the mouse while holding the button moves that glow.
 */

document.addEventListener("pointerdown", event => {
    // Leave the sound button usable.
    if (event.target.closest("#soundButton")) return;

    // Ignore right-click and middle-click.
    if (event.pointerType === "mouse" && event.button !== 0) {
        return;
    }

    // Avoid duplicate IDs.
    removeGlow(event.pointerId);

    createGlow(
        event.pointerId,
        event.clientX,
        event.clientY
    );

    // Keep receiving this pointer's events as it moves.
    if (event.target.setPointerCapture) {
        try {
            event.target.setPointerCapture(event.pointerId);
        } catch (error) {
            // Continue using document-level pointer events.
        }
    }

    // Prevent touch gestures from interfering with the interaction.
    if (event.pointerType !== "mouse") {
        event.preventDefault();
    }
});

document.addEventListener("pointermove", event => {
    if (!activeGlows.has(event.pointerId)) return;

    moveGlow(
        event.pointerId,
        event.clientX,
        event.clientY
    );

    if (event.pointerType !== "mouse") {
        event.preventDefault();
    }
});

document.addEventListener("pointerup", event => {
    removeGlow(event.pointerId);
});

document.addEventListener("pointercancel", event => {
    removeGlow(event.pointerId);
});

document.addEventListener("lostpointercapture", event => {
    removeGlow(event.pointerId);
});

// Prevent glows being left behind if the browser window loses focus.
window.addEventListener("blur", removeAllGlows);


/* =========================================
   W IMAGE POPUP
   Shows for 3 seconds every 24 hours.
========================================= */

const popupImage = document.getElementById("popup-image");
const popupStorageKey = "xbCountdownLastWPopup";
const popupInterval = 24 * 60 * 60 * 1000;
const popupDuration = 3000;

let popupTimer = null;

function showPopup() {
    if (popupTimer) {
        clearTimeout(popupTimer);
    }

    popupImage.classList.remove("show");

    // Restart the animation cleanly.
    void popupImage.offsetWidth;

    popupImage.classList.add("show");

    popupTimer = setTimeout(() => {
        popupImage.classList.remove("show");
        popupTimer = null;
    }, popupDuration);
}

function checkPopupSchedule() {
    const now = Date.now();
    const lastShown = Number(
        localStorage.getItem(popupStorageKey) || 0
    );

    if (!lastShown || now - lastShown >= popupInterval) {
        localStorage.setItem(popupStorageKey, String(now));
        showPopup();
    }
}

// Check on page load.
checkPopupSchedule();

// Check again if the page is revisited after being inactive.
window.addEventListener("focus", checkPopupSchedule);

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        checkPopupSchedule();
    }
});

// To test the popup manually, run showPopup() in the browser console.
</script>
</body>
</html>
