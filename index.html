
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ICSE 2027 Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  font-family: Arial, Helvetica, sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #080808;
}

.scene {
  position: relative;
  width: min(100vw, 177.7778vh);
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

.overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.heading {
  fill: #f5c65b;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 6px;
  text-anchor: middle;
}

.timer {
  fill: #ffe7ac;
  font-size: 76px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  text-anchor: middle;
  filter: url(#goldGlow);
}

.labels {
  fill: #f3c65c;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 2px;
  text-anchor: middle;
}

.exam {
  fill: #ffe8b0;
  font-size: 37px;
  font-weight: 800;
  letter-spacing: 3px;
  text-anchor: middle;
}

.quote {
  fill: #f3c65c;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 1px;
  text-anchor: middle;
}

@media (max-width: 600px) {
  .heading { font-size: 25px; }
  .timer { font-size: 76px; }
  .labels { font-size: 19px; }
  .exam { font-size: 36px; }
  .quote { font-size: 20px; }
}
</style>
</head>

<body>
<div class="stage">
  <div class="scene">

    <!-- Keep background.jpg in the same folder as index.html -->
    <img class="background"
         src="./background.jpg"
         alt="Black and gold background">

    <svg class="overlay"
         viewBox="0 0 1600 900"
         preserveAspectRatio="none"
         aria-label="ICSE 2027 countdown">

      <defs>
        <filter id="goldGlow"
                x="-20%" y="-30%"
                width="140%" height="160%">
          <feGaussianBlur stdDeviation="2"
                          result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Main curved line -->
        <path id="headingPath"
              d="M 400 330 Q 800 285 1200 330"/>

        <path id="timerPath"
              d="M 300 445 Q 800 365 1300 445"/>

        <!-- Labels use the SAME curve, shifted down -->
        <path id="labelsPath"
              d="M 300 482 Q 800 402 1300 482"/>

        <path id="examPath"
              d="M 500 565 Q 800 545 1100 565"/>

        <path id="quotePath"
              d="M 420 630 Q 800 660 1180 630"/>
      </defs>

      <text class="heading">
        <textPath href="#headingPath"
                  startOffset="50%">
          EXAM COUNTDOWN
        </textPath>
      </text>

      <text class="timer">
        <textPath id="timerText"
                  href="#timerPath"
                  startOffset="50%">
          000 : 00 : 00 : 00
        </textPath>
      </text>

      <!-- Four separate labels, individually aligned
           beneath the corresponding curved number groups -->
      <text class="labels">
        <textPath href="#labelsPath"
                  startOffset="36%">
          DAYS
        </textPath>
      </text>

      <text class="labels">
        <textPath href="#labelsPath"
                  startOffset="46%">
          HRS
        </textPath>
      </text>

      <text class="labels">
        <textPath href="#labelsPath"
                  startOffset="55%">
          MIN
        </textPath>
      </text>

      <text class="labels">
        <textPath href="#labelsPath"
                  startOffset="64%">
          SEC
        </textPath>
      </text>

      <text class="exam">
        <textPath href="#examPath"
                  startOffset="50%">
          ICSE 2027
        </textPath>
      </text>

      <text class="quote">
        <textPath href="#quotePath"
                  startOffset="50%">
          SMALL STEPS TODAY. BIG RESULTS TOMORROW.
        </textPath>
      </text>

    </svg>
  </div>
</div>

<script>
/* Target: 17 February 2027 at 12:00 PM local time.
   Update this if the official exam date is different. */
const examDate = new Date(2027, 1, 17, 12, 0, 0);

const timerText = document.getElementById("timerText");

function updateCountdown() {
  const remaining = Math.max(
    0,
    examDate.getTime() - Date.now()
  );

  const total = Math.floor(remaining / 1000);

  const days = Math.floor(total / 86400);
  const hours = Math.floor((total % 86400) / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;

  timerText.textContent =
    String(days).padStart(3, "0") + " : " +
    String(hours).padStart(2, "0") + " : " +
    String(minutes).padStart(2, "0") + " : " +
    String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
