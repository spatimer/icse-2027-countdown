
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>ICSE 2027 Golden Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  font-family: Arial, Helvetica, sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080808;
}

.scene {
  position: relative;
  width: min(100vw, 177.7778vh);
  aspect-ratio: 16 / 9;
  overflow: hidden;
}

/* IMPORTANT: the filename must match the file in GitHub */
.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.heading {
  fill: #efbd4c;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 6px;
  text-anchor: middle;
}

.timer {
  fill: #ffe5a0;
  font-size: 76px;
  font-weight: 800;
  letter-spacing: 0;
  text-anchor: middle;
  font-variant-numeric: tabular-nums;
  filter: url(#glow);
}

.colon {
  fill: #d9a52e;
  font-size: 52px;
  font-weight: 500;
}

.labels {
  fill: #f0c75e;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 3px;
  text-anchor: middle;
}

.exam {
  fill: #ffe8ad;
  font-size: 37px;
  font-weight: 800;
  letter-spacing: 3px;
  text-anchor: middle;
}

.quote {
  fill: #eac05a;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-anchor: middle;
}

@media (max-width: 600px) {
  .heading {
    font-size: 25px;
    letter-spacing: 4px;
  }

  .timer {
    font-size: 76px;
  }

  .colon {
    font-size: 52px;
  }

  .labels {
    font-size: 18px;
    letter-spacing: 2px;
  }

  .exam {
    font-size: 36px;
  }

  .quote {
    font-size: 20px;
    letter-spacing: 1px;
  }
}
</style>
</head>

<body>
<div class="stage">
  <div class="scene">

    <!-- Keep background.jpg in the same repository folder -->
    <img
      class="background"
      src="./background.jpg"
      alt="Black and gold abstract background"
    >

    <svg viewBox="0 0 1600 900"
         preserveAspectRatio="none"
         aria-label="ICSE 2027 countdown">

      <defs>
        <filter id="glow" x="-20%" y="-40%"
                width="140%" height="180%">
          <feGaussianBlur stdDeviation="2.5"
                          result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- The countdown follows this gentle wave -->
        <path id="headingPath"
          d="M 400 330 Q 800 285 1200 330"/>

        <path id="timerPath"
          d="M 300 445 Q 800 365 1300 445"/>

        <!-- Labels follow a similar curve beneath the numbers -->
        <path id="labelPath"
          d="M 300 495 Q 800 415 1300 495"/>

        <path id="examPath"
          d="M 500 565 Q 800 545 1100 565"/>

        <path id="quotePath"
          d="M 420 630 Q 800 660 1180 630"/>
      </defs>

      <text class="heading">
        <textPath href="#headingPath"
                  startOffset="50%">
          EXAM COUNTDOWN
        </textPath>
      </text>

      <!-- Main curved countdown -->
      <text class="timer">
        <textPath id="timerText"
                  href="#timerPath"
                  startOffset="50%">
          000  :  00  :  00  :  00
        </textPath>
      </text>

      <!-- Labels beneath the corresponding number groups -->
      <text class="labels">
        <textPath href="#labelPath"
                  startOffset="50%">
          DAYS       HRS       MIN       SEC
        </textPath>
      </text>

      <text class="exam">
        <textPath href="#examPath"
                  startOffset="50%">
          ICSE 2027
        </textPath>
      </text>

      <text class="quote">
        <textPath href="#quotePath"
                  startOffset="50%">
          SMALL STEPS TODAY. BIG RESULTS TOMORROW.
        </textPath>
      </text>

    </svg>
  </div>
</div>

<script>
/* 17 February 2027, 12:00 PM local time.
   Change this if your official exam date differs. */
const examDate = new Date(2027, 1, 17, 12, 0, 0);

const timerText = document.getElementById("timerText");

function updateCountdown() {
  const remaining = Math.max(
    0,
    examDate.getTime() - Date.now()
  );

  const total = Math.floor(remaining / 1000);

  const days = Math.floor(total / 86400);
  const hours = Math.floor((total % 86400) / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;

  const d = String(days).padStart(3, "0");
  const h = String(hours).padStart(2, "0");
  const m = String(minutes).padStart(2, "0");
  const s = String(seconds).padStart(2, "0");

  timerText.textContent = `${d}  :  ${h}  :  ${m}  :  ${s}`;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
