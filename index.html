
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050707">
<title>ICSE 2027 Countdown</title>

<style>
:root {
  /* Counter position and size */
  --screen-left: 35%;
  --screen-top: 36%;
  --screen-width: 46%;
  --screen-height: 27%;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #050707;
  font-family: Arial, sans-serif;
}

.scene {
  position: fixed;
  inset: 0;
  background: #050707 url("./background.jpg")
    center center / contain no-repeat;
}

.display-content {
  position: fixed;
  left: var(--screen-left);
  top: var(--screen-top);
  width: var(--screen-width);
  height: var(--screen-height);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  padding: 1%;

  color: #ffd18a;
  text-shadow: 0 0 5px rgba(255, 176, 70, 0.7);

  /* Gentle tilt to follow the display */
  transform: rotate(-3deg) skewX(-1deg);
  transform-origin: center;
}

.eyebrow {
  margin: 0 0 5px;
  font-size: clamp(7px, 1.05vw, 17px);
  font-weight: bold;
  letter-spacing: 0.2em;
  white-space: nowrap;
}

.timer {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: clamp(3px, 0.7vw, 12px);
  width: 100%;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.value {
  font-size: clamp(14px, 3vw, 48px);
  font-weight: 600;
  line-height: 1.05;
}

.label {
  margin-top: 4px;
  font-size: clamp(5px, 0.72vw, 12px);
  letter-spacing: 0.08em;
}

.headline {
  margin: 8px 0 0;
  font-size: clamp(10px, 1.8vw, 28px);
  font-weight: bold;
  white-space: nowrap;
}

.subline {
  margin: 4px 0 0;
  font-size: clamp(6px, 1.1vw, 18px);
  white-space: nowrap;
}

@media (max-aspect-ratio: 4/3) {
  .scene {
    background-size: 100% auto;
  }
}
</style>
</head>

<body>
<div class="scene"></div>

<main class="display-content">
  <p class="eyebrow">EXAM COUNTDOWN</p>

  <div class="timer">
    <div class="unit">
      <span class="value" id="days">000</span>
      <span class="label">DAYS</span>
    </div>

    <div class="unit">
      <span class="value" id="hours">00</span>
      <span class="label">HRS</span>
    </div>

    <div class="unit">
      <span class="value" id="minutes">00</span>
      <span class="label">MIN</span>
    </div>

    <div class="unit">
      <span class="value" id="seconds">00</span>
      <span class="label">SEC</span>
    </div>
  </div>

  <p class="headline">ICSE 2027</p>
  <p class="subline">COUNTING DOWN TO EXAM DAY</p>
</main>

<script>
/* Provisional target: 17 February 2027, 11:00 AM
   This is not a confirmation of the official exam date. */
const targetDate = new Date(2027, 1, 17, 11, 0, 0);

function updateCountdown() {
  let remaining = Math.max(
    0,
    targetDate.getTime() - Date.now()
  );

  const totalSeconds = Math.floor(remaining / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  document.getElementById("days").textContent =
    String(days).padStart(3, "0");

  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");

  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");

  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
