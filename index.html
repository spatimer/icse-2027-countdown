
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICSE 2027 Countdown</title>

<style>
* { box-sizing: border-box; }

:root {
  --gold: #ffc66b;
  --amber: #ff9e32;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #101113;
  color: var(--gold);
  font-family: "Courier New", monospace;
}

.room {
  width: 100%;
  height: 100%;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 42%,
      #35332d 0%, #222321 34%, #141517 72%, #090a0b 100%);
}

/* Industrial wall panels */
.wall {
  position: absolute;
  inset: 0;
  opacity: .75;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 175px,
      #080909 177px,
      #45433c 179px,
      transparent 182px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 135px,
      #080909 137px,
      #35342f 139px,
      transparent 142px
    );
}

/* Ceiling pipes */
.pipe {
  position: absolute;
  top: 7%;
  width: 110%;
  left: -5%;
  height: 16px;
  background: linear-gradient(
    to bottom, #55544d, #171819 40%, #050606 75%, #3d3b35
  );
  border: 1px solid #080909;
  box-shadow: 0 8px 18px #000b;
}

.pipe.two {
  top: 13%;
  height: 9px;
  opacity: .7;
}

.side-pipe {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 5%;
  width: 13px;
  background: linear-gradient(90deg,#080909,#4b4941,#151617);
  box-shadow: 8px 0 20px #0008;
}

.side-pipe.right {
  left: auto;
  right: 5%;
}

/* Wall-mounted terminal */
.terminal {
  position: relative;
  z-index: 2;
  width: min(82vw, 1050px);
  padding: 12px;
  background: linear-gradient(135deg,#55534b,#111213 25%,#292a28 75%,#070808);
  border: 2px solid #5b584d;
  border-radius: 9px;
  box-shadow:
    0 0 0 5px #101112,
    0 0 0 7px #38372f,
    0 25px 65px #000e,
    0 0 55px #ffad3620;
}

.screws {
  position: absolute;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,#aaa79b,#262622 60%,#080909);
  border: 1px solid #080909;
}

.tl { top: 8px; left: 8px; }
.tr { top: 8px; right: 8px; }
.bl { bottom: 8px; left: 8px; }
.br { bottom: 8px; right: 8px; }

.screen {
  min-height: 340px;
  padding: clamp(24px, 5vw, 65px) 15px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background:
    linear-gradient(145deg,#080909,#11110e 50%,#080909);
  border: 1px solid #171714;
  box-shadow: inset 0 0 45px #000;
}

.status {
  font-size: clamp(10px,1.4vw,15px);
  letter-spacing: .42em;
  color: #bd873e;
  margin-bottom: 14px;
}

.heading {
  color: #e9bd72;
  font-size: clamp(19px,3vw,34px);
  letter-spacing: .16em;
  margin-bottom: 35px;
  text-shadow: 0 0 15px #ffb94a45;
}

.timer {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: clamp(7px,2.2vw,26px);
  width: 100%;
}

.unit {
  min-width: 0;
  flex: 1;
}

.number {
  font-size: clamp(28px,7.3vw,88px);
  font-weight: bold;
  line-height: 1;
  letter-spacing: -.06em;
  color: #ffc66b;
  text-shadow:
    0 0 7px #ffb33c,
    0 0 24px #ff9c22a0,
    0 0 50px #ff9c2240;
  font-variant-numeric: tabular-nums;
}

.label {
  font-size: clamp(9px,1.2vw,13px);
  color: #aa8855;
  letter-spacing: .15em;
  margin-top: 17px;
}

.separator {
  font-size: clamp(25px,5vw,56px);
  color: #a87431;
  padding-top: 0;
  animation: pulse 2s infinite;
}

.footer {
  margin-top: 43px;
  color: #967342;
  font-size: clamp(9px,1.2vw,13px);
  letter-spacing: .18em;
}

.indicator {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 9px;
  border-radius: 50%;
  background: #ffc66b;
  box-shadow: 0 0 12px #ffb43e;
  animation: pulse 1.6s infinite;
}

.floor {
  position: absolute;
  left: -10%;
  right: -10%;
  bottom: -20%;
  height: 30%;
  transform: perspective(300px) rotateX(25deg);
  background:
    repeating-linear-gradient(90deg,#242522 0 2px,transparent 2px 150px),
    repeating-linear-gradient(0deg,#242522 0 2px,transparent 2px 80px);
  opacity: .25;
}

@keyframes pulse {
  50% { opacity: .45; }
}

@media(max-width:500px) {
  .terminal { width: 92vw; padding: 8px; }
  .screen { min-height: 270px; padding: 30px 5px; }
  .heading { margin-bottom: 28px; }
  .footer { margin-top: 30px; }
}
</style>
</head>

<body>
<div class="room">
  <div class="wall"></div>
  <div class="pipe"></div>
  <div class="pipe two"></div>
  <div class="side-pipe"></div>
  <div class="side-pipe right"></div>
  <div class="floor"></div>

  <main class="terminal">
    <span class="screws tl"></span>
    <span class="screws tr"></span>
    <span class="screws bl"></span>
    <span class="screws br"></span>

    <section class="screen">
      <div class="status">ACADEMIC COUNTDOWN SYSTEM</div>
      <div class="heading">ICSE 2027</div>

      <div class="timer">
        <div class="unit">
          <div class="number" id="days">000</div>
          <div class="label">DAYS</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
          <div class="number" id="hours">00</div>
          <div class="label">HOURS</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
          <div class="number" id="minutes">00</div>
          <div class="label">MINUTES</div>
        </div>
        <div class="separator">:</div>
        <div class="unit">
          <div class="number" id="seconds">00</div>
          <div class="label">SECONDS</div>
        </div>
      </div>

      <div class="footer">
        <span class="indicator"></span>
        COUNTDOWN ACTIVE · CLASS X
      </div>
    </section>
  </main>
</div>

<script>
// Provisional target: February 17, 2027 at 11:00 AM local time.
const EXAM_DATE = new Date(2027, 1, 17, 11, 0, 0);

function updateCountdown() {
  let remaining = EXAM_DATE.getTime() - Date.now();

  if (remaining < 0) remaining = 0;

  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  document.getElementById("days").textContent =
    String(days).padStart(3, "0");
  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");
  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");
  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
