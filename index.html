
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>ICSE 2027 Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  font-family: Arial, Helvetica, sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #080808;
}

.scene {
  position: relative;
  width: min(100vw, 177.7778vh);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #080808;
}

.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}

/* Overlay uses the same 16:9 coordinates as the background */
.overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.heading {
  fill: #f5c65b;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 6px;
  text-anchor: middle;
}

.timer-number {
  fill: #ffe7ac;
  font-size: 76px;
  font-weight: 800;
  text-anchor: middle;
  font-variant-numeric: tabular-nums;
  filter: url(#goldGlow);
}

.colon {
  fill: #d9ad4b;
  font-size: 48px;
  font-weight: 500;
  text-anchor: middle;
}

.labels {
  fill: #f3c65c;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 2px;
  text-anchor: middle;
}

.exam {
  fill: #ffe8b0;
  font-size: 37px;
  font-weight: 800;
  letter-spacing: 3px;
  text-anchor: middle;
}

.quote {
  fill: #f3c65c;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 1px;
  text-anchor: middle;
}

@media (max-width: 600px) {
  .heading {
    font-size: 24px;
    letter-spacing: 4px;
  }

  .timer-number {
    font-size: 76px;
  }

  .colon {
    font-size: 48px;
  }

  .labels {
    font-size: 19px;
    letter-spacing: 2px;
  }

  .exam {
    font-size: 36px;
  }

  .quote {
    font-size: 20px;
  }
}
</style>
</head>

<body>
<div class="stage">
  <div class="scene">

    <!-- Keep background.jpg in the same folder as index.html -->
    <img
      class="background"
      src="./background.jpg"
      alt="Black and gold background"
    >

    <svg
      class="overlay"
      viewBox="0 0 1600 900"
      preserveAspectRatio="none"
      role="img"
      aria-label="ICSE 2027 exam countdown"
    >
      <defs>
        <filter id="goldGlow"
          x="-20%" y="-30%"
          width="140%" height="160%">
          <feGaussianBlur stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Gentle curve for the heading -->
        <path id="headingPath"
          d="M 400 330 Q 800 285 1200 330"/>

        <!-- Gentle river-like curve for the countdown -->
        <path id="timerPath"
          d="M 300 445 Q 800 365 1300 445"/>

        <path id="quotePath"
          d="M 420 630 Q 800 660 1180 630"/>
      </defs>

      <!-- Curved heading -->
      <text class="heading">
        <textPath href="#headingPath" startOffset="50%">
          EXAM COUNTDOWN
        </textPath>
      </text>

      <!--
        Each number and label share the same horizontal centre.
        Their individual positions follow the curved layout.
      -->

      <!-- DAYS column -->
      <text id="daysNumber" class="timer-number"
        x="400" y="428">000</text>
      <text class="labels" x="400" y="463">DAYS</text>

      <!-- Hours column -->
      <text id="hoursNumber" class="timer-number"
        x="665" y="389">00</text>
      <text class="labels" x="665" y="424">HRS</text>

      <!-- Minutes column -->
      <text id="minutesNumber" class="timer-number"
        x="935" y="389">00</text>
      <text class="labels" x="935" y="424">MIN</text>

      <!-- Seconds column -->
      <text id="secondsNumber" class="timer-number"
        x="1200" y="428">00</text>
      <text class="labels" x="1200" y="463">SEC</text>

      <!-- Smaller colons between the number groups -->
      <text class="colon" x="535" y="407">:</text>
      <text class="colon" x="800" y="368">:</text>
      <text class="colon" x="1068" y="407">:</text>

      <!-- Exam title -->
      <text class="exam" x="800" y="555">
        ICSE 2027
      </text>

      <!-- Motivational quote -->
      <text class="quote">
        <textPath href="#quotePath" startOffset="50%">
          SMALL STEPS TODAY. BIG RESULTS TOMORROW.
        </textPath>
      </text>
    </svg>
  </div>
</div>

<script>
/*
  Target: 17 February 2027 at 12:00 PM local time.
  This is a provisional date; verify the official exam schedule.
*/
const examDate = new Date(2027, 1, 17, 12, 0, 0);

const daysEl = document.getElementById("daysNumber");
const hoursEl = document.getElementById("hoursNumber");
const minutesEl = document.getElementById("minutesNumber");
const secondsEl = document.getElementById("secondsNumber");

function updateCountdown() {
  const remaining = Math.max(
    0,
    examDate.getTime() - Date.now()
  );

  const totalSeconds = Math.floor(remaining / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  daysEl.textContent = String(days).padStart(3, "0");
  hoursEl.textContent = String(hours).padStart(2, "0");
  minutesEl.textContent = String(minutes).padStart(2, "0");
  secondsEl.textContent = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
