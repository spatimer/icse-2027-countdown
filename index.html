
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-B Exam Countdown</title>

<style>
:root {
    --gold: #e7b76b;
    --gold-light: #ffdda0;
    --white: #fffaf2;
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #071225 url("background.jpg") center center / cover no-repeat;
    color: var(--white);
    font-family: Georgia, "Times New Roman", serif;
}

/* Countdown positioning */
.countdown-panel {
    position: absolute;
    left: 60%;
    top: 44%;
    transform: translate(-50%, -50%);
    width: min(1350px, 72vw);
    text-align: center;
    z-index: 2;
}

/* Heading and decorative lines */
.heading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 32px;
}

.heading::before,
.heading::after {
    content: "";
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold));
    opacity: 0.9;
}

.heading::after {
    background: linear-gradient(90deg, var(--gold), transparent);
}

.heading span {
    color: var(--gold-light);
    font-size: clamp(15px, 1.6vw, 26px);
    font-weight: bold;
    letter-spacing: 4px;
    white-space: nowrap;
    text-shadow: 0 0 12px #dca75a55;
}

/* Countdown units kept closer together */
.timer {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(2px, 0.45vw, 8px);
    width: 100%;
}

.unit {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
}

.number {
    color: #fffdf9;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(34px, 4.2vw, 68px);
    font-weight: 700;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 14px #0008;
}

.label {
    margin-top: 7px;
    color: var(--gold-light);
    font-size: clamp(12px, 1.25vw, 20px);
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px #0009;
}

/* Gold colon separators */
.separator {
    flex: 0 0 auto;
    padding-top: 1px;
    color: var(--gold);
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(30px, 3.5vw, 55px);
    font-weight: 300;
    line-height: 1;
    opacity: 0.9;
    text-shadow: 0 0 12px #e7b76b44;
}

/* Class heading */
.class-heading {
    margin-top: 38px;
    color: var(--gold-light);
    font-size: clamp(32px, 3.5vw, 54px);
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 2px 15px #0009;
}

/* Motivational line */
.motivation {
    margin-top: 14px;
    color: #fff0d6;
    font-size: clamp(14px, 1.5vw, 24px);
    font-style: italic;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px #000b;
}

/* Subtle, translucent sound button */
.sound-button {
    position: fixed;
    top: 25px;
    right: 28px;
    z-index: 30;
    width: 48px;
    height: 48px;
    border: 1px solid #ffffff20;
    border-radius: 50%;
    background: #ffffff08;
    color: #f7d49b;
    font-size: 21px;
    cursor: pointer;
    opacity: 0.55;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    transition: opacity 0.25s, background 0.25s;
}

.sound-button:hover,
.sound-button:focus-visible {
    opacity: 0.9;
    background: #ffffff16;
}

/* Golden glow follows the mouse or finger */
.touch-glow {
    position: fixed;
    left: 0;
    top: 0;
    width: 340px;
    height: 340px;
    z-index: 20;
    pointer-events: none;
    opacity: 0;

    background: radial-gradient(
        circle,
        rgba(255, 222, 157, 0.72) 0%,
        rgba(255, 190, 91, 0.42) 13%,
        rgba(239, 166, 66, 0.19) 32%,
        rgba(220, 155, 68, 0.07) 55%,
        rgba(220, 155, 68, 0) 75%
    );

    transform: translate(-50%, -50%);
    transition: opacity 0.2s ease;
    mix-blend-mode: screen;
}

.touch-glow.active {
    opacity: 1;
}

/* W popup image */
#popup-image {
    position: fixed;
    z-index: 25;
    left: 60%;
    top: 44%;
    width: min(420px, 48vw);
    height: 210px;
    max-height: 40vh;
    object-fit: contain;
    object-position: center;
    transform: translate(-50%, -50%) scale(0.96);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(231, 183, 107, 0.18));
}

#popup-image.visible {
    visibility: visible;
    animation: popup-appear 3s ease both;
}

@keyframes popup-appear {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.96);
    }

    12% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    82% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.98);
    }
}

/* Smaller-screen adjustments */
@media (max-width: 700px) {
    .countdown-panel {
        left: 50%;
        top: 45%;
        width: 94vw;
    }

    .heading {
        gap: 10px;
        margin-bottom: 24px;
    }

    .heading span {
        font-size: clamp(12px, 3.2vw, 18px);
        letter-spacing: 2px;
    }

    .timer {
        gap: 2px;
    }

    .number {
        font-size: clamp(25px, 7vw, 44px);
    }

    .label {
        font-size: clamp(9px, 2.3vw, 14px);
        letter-spacing: 0.4px;
        margin-top: 7px;
    }

    .separator {
        font-size: clamp(22px, 5.5vw, 35px);
    }

    .class-heading {
        margin-top: 30px;
        font-size: clamp(28px, 7vw, 42px);
    }

    .motivation {
        font-size: clamp(12px, 3vw, 17px);
        margin-top: 12px;
    }

    .sound-button {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
    }

    #popup-image {
        left: 43%;
        top: 45%;
        width: 76vw;
        height: 150px;
        max-height: 32vh;
    }
}
</style>
</head>

<body>

<button
    class="sound-button"
    id="soundButton"
    aria-label="Turn ticking sound on or off"
    title="Toggle ticking sound"
>♩</button>

<main class="countdown-panel">

    <div class="heading">
        <span>EXAM COUNTDOWN</span>
    </div>

    <div class="timer" aria-label="Time remaining until the examination">

        <div class="unit">
            <div class="number" id="months">00</div>
            <div class="label">MONTHS</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="hours">00</div>
            <div class="label">HRS</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="minutes">00</div>
            <div class="label">MIN</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="seconds">00</div>
            <div class="label">SEC</div>
        </div>

    </div>

    <div class="class-heading">X-B</div>

    <div class="motivation">
        Every second counts. Every effort matters.
    </div>

</main>

<div class="touch-glow" id="touchGlow"></div>

<!-- Original W image; keep popup.png beside index.html -->
<img
    id="popup-image"
    src="popup.png"
    alt=""
    aria-hidden="true"
>

<script>
/* Exam countdown target: 17 February 2027 at 12:00 noon IST.
   The target is unchanged from your supplied code. */

const examDate = new Date("2027-02-17T12:00:00+05:30");

const $ = id => document.getElementById(id);

const pad = value => String(value).padStart(2, "0");

/* Calendar-based months, followed by days and clock time */
function getCalendarCountdown(now, target) {
    if (now >= target) {
        return {
            months: 0,
            days: 0,
            hours: 0,
            minutes: 0,
            seconds: 0
        };
    }

    let months =
        (target.getFullYear() - now.getFullYear()) * 12 +
        target.getMonth() - now.getMonth();

    function addMonthsClamped(date, count) {
        const result = new Date(date.getTime());
        const originalDay = result.getDate();

        result.setDate(1);
        result.setMonth(result.getMonth() + count);

        const lastDay = new Date(
            result.getFullYear(),
            result.getMonth() + 1,
            0
        ).getDate();

        result.setDate(Math.min(originalDay, lastDay));
        return result;
    }

    let anchor = addMonthsClamped(now, months);

    if (anchor > target) {
        months--;
        anchor = addMonthsClamped(now, months);
    }

    let remaining = Math.max(
        0,
        target.getTime() - anchor.getTime()
    );

    const days = Math.floor(remaining / 86400000);
    remaining %= 86400000;

    const hours = Math.floor(remaining / 3600000);
    remaining %= 3600000;

    const minutes = Math.floor(remaining / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);

    return { months, days, hours, minutes, seconds };
}

function updateCountdown() {
    const result = getCalendarCountdown(new Date(), examDate);

    $("months").textContent = pad(result.months);
    $("days").textContent = pad(result.days);
    $("hours").textContent = pad(result.hours);
    $("minutes").textContent = pad(result.minutes);
    $("seconds").textContent = pad(result.seconds);
}

updateCountdown();
setInterval(updateCountdown, 1000);


/* Golden glow: follows mouse while left-clicking and finger while touching */
const glow = $("touchGlow");
const activePointers = new Set();

function showGlow(x, y) {
    glow.style.left = x + "px";
    glow.style.top = y + "px";
    glow.classList.add("active");
}

function hideGlow(pointerId) {
    activePointers.delete(pointerId);

    if (activePointers.size === 0) {
        glow.classList.remove("active");
    }
}

document.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) {
        return;
    }

    activePointers.add(event.pointerId);
    showGlow(event.clientX, event.clientY);
});

document.addEventListener("pointermove", event => {
    if (!activePointers.has(event.pointerId)) return;

    if (event.pointerType === "mouse" && !(event.buttons & 1)) {
        hideGlow(event.pointerId);
        return;
    }

    showGlow(event.clientX, event.clientY);
});

document.addEventListener("pointerup", event => {
    hideGlow(event.pointerId);
});

document.addEventListener("pointercancel", event => {
    hideGlow(event.pointerId);
});

window.addEventListener("blur", () => {
    activePointers.clear();
    glow.classList.remove("active");
});


/* W popup: appears for 3 seconds every 24 hours */
const popupImage = $("popup-image");

const POPUP_INTERVAL = 24 * 60 * 60 * 1000;
const POPUP_DURATION = 3000;
const LAST_POPUP_KEY = "xbCountdownLastWPopup";

let popupTimeout = null;

function showPopup() {
    popupImage.classList.remove("visible");

    /* Restart the animation */
    void popupImage.offsetWidth;

    popupImage.classList.add("visible");

    if (popupTimeout) {
        clearTimeout(popupTimeout);
    }

    popupTimeout = setTimeout(() => {
        popupImage.classList.remove("visible");
        popupTimeout = null;
    }, POPUP_DURATION);
}

function checkPopupSchedule() {
    const now = Date.now();
    const storedTime = localStorage.getItem(LAST_POPUP_KEY);
    const lastPopup = Number(storedTime || 0);

    /* Start the 24-hour timer on the first visit */
    if (!storedTime || !Number.isFinite(lastPopup) || lastPopup <= 0) {
        localStorage.setItem(LAST_POPUP_KEY, String(now));
        return;
    }

    if (now - lastPopup >= POPUP_INTERVAL) {
        localStorage.setItem(LAST_POPUP_KEY, String(now));
        showPopup();
    }
}

/* Check when the page loads */
checkPopupSchedule();

/* Check periodically while the page remains open */
setInterval(checkPopupSchedule, 60 * 1000);

/* Check when returning to the page */
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        checkPopupSchedule();
    }
});

window.addEventListener("focus", checkPopupSchedule);


/* Optional soft ticking sound — original behaviour retained */
let audioContext = null;
let tickTimer = null;
let soundOn = false;

const soundButton = $("soundButton");

function playTick() {
    if (!audioContext || !soundOn) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const start = audioContext.currentTime;

    oscillator.type = "sine";
    oscillator.frequency.value = 850;

    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.035, start + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.055);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(start);
    oscillator.stop(start + 0.06);
}

soundButton.addEventListener("click", async () => {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    soundOn = !soundOn;

    if (soundOn) {
        soundButton.textContent = "♫";
        soundButton.style.opacity = "0.85";

        playTick();
        tickTimer = setInterval(playTick, 1000);
    } else {
        soundButton.textContent = "♩";
        soundButton.style.opacity = "0.55";

        clearInterval(tickTimer);
        tickTimer = null;
    }
});
</script>

</body>
</html>
