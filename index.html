
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICSE 2027 | Final Countdown</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080909;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f6c56d;
        }

        body {
            position: relative;
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Dark cinematic overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.42),
                    rgba(0, 0, 0, 0.12),
                    rgba(0, 0, 0, 0.42)
                ),
                linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.58),
                    transparent 35%,
                    rgba(0, 0, 0, 0.22)
                );
            z-index: 0;
            pointer-events: none;
        }

        /* Main countdown area */
        .main {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .heading {
            position: absolute;
            top: 9%;
            left: 0;
            width: 100%;
            text-align: center;
            color: #f8d18a;
            font-size: clamp(18px, 2vw, 30px);
            font-weight: 500;
            letter-spacing: 0.38em;
            text-shadow: 0 0 18px rgba(246, 176, 68, 0.35);
        }

        .subtitle {
            position: absolute;
            top: calc(9% + 48px);
            width: 100%;
            text-align: center;
            color: rgba(255, 224, 172, 0.72);
            font-size: clamp(9px, 0.9vw, 13px);
            letter-spacing: 0.34em;
        }

        /* Countdown row */
        .countdown {
            position: absolute;
            left: 60%;
            top: 44%;
            transform: translate(-50%, -50%);
            width: min(1350px, 72vw);
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: center;
            text-align: center;
        }

        .unit {
            min-width: 0;
            position: relative;
            padding: 12px 4px;
        }

        .number {
            color: #ffd17a;
            font-size: clamp(38px, 6.5vw, 100px);
            line-height: 1;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            text-shadow:
                0 0 8px rgba(255, 184, 71, 0.58),
                0 0 28px rgba(255, 161, 42, 0.22);
        }

        .label {
            margin-top: 17px;
            color: rgba(255, 224, 174, 0.75);
            font-size: clamp(9px, 0.85vw, 13px);
            letter-spacing: 0.28em;
        }

        .footer {
            position: absolute;
            bottom: 7%;
            width: 100%;
            text-align: center;
            color: rgba(255, 222, 165, 0.68);
            font-size: clamp(10px, 1vw, 14px);
            letter-spacing: 0.22em;
        }

        /* Golden glow that follows mouse or touch */
        .glow {
            position: fixed;
            z-index: 5;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(255, 190, 90, 0.18) 0%,
                rgba(255, 164, 45, 0.08) 32%,
                transparent 72%
            );
            mix-blend-mode: screen;
        }

        /* Popup image: covers days, hours and minutes, leaving seconds visible */
        #popup-image {
            position: fixed;
            z-index: 20;
            left: 60%;
            top: 44%;
            width: min(420px, 48vw);
            height: 210px;
            max-height: 40vh;
            object-fit: contain;
            object-position: center;
            transform: translate(-50%, -50%) scale(0.94);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            filter: drop-shadow(
                0 0 22px rgba(255, 183, 75, 0.28)
            );
        }

        #popup-image.visible {
            visibility: visible;
            animation: popup-appear 3s ease both;
        }

        @keyframes popup-appear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.94);
            }

            12% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            82% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.98);
            }
        }

        /* Sound control */
        .sound-toggle {
            position: fixed;
            z-index: 30;
            right: 20px;
            bottom: 18px;
            padding: 9px 13px;
            border: 1px solid rgba(255, 196, 100, 0.35);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.42);
            color: #f8d18a;
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
        }

        .sound-toggle:hover {
            background: rgba(255, 190, 90, 0.12);
        }

        /* Smaller screens */
        @media (max-width: 700px) {
            .heading {
                top: 12%;
                letter-spacing: 0.22em;
            }

            .subtitle {
                top: calc(12% + 36px);
                letter-spacing: 0.18em;
            }

            .countdown {
                left: 50%;
                top: 48%;
                width: 96vw;
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .unit {
                padding: 8px 1px;
            }

            .number {
                font-size: clamp(25px, 8vw, 48px);
            }

            .label {
                margin-top: 12px;
                font-size: clamp(7px, 1.8vw, 10px);
                letter-spacing: 0.08em;
            }

            #popup-image {
                left: 38%;
                top: 48%;
                width: 72vw;
                height: 150px;
                max-height: 32vh;
            }

            .footer {
                bottom: 9%;
                padding: 0 12px;
                font-size: 9px;
                letter-spacing: 0.12em;
            }

            .sound-toggle {
                right: 10px;
                bottom: 10px;
                font-size: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .glow {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="main">
        <div class="heading">X-B</div>
        <div class="subtitle">THE FINAL COUNTDOWN</div>

        <div class="countdown" id="countdown">
            <div class="unit">
                <div class="number" id="days">000</div>
                <div class="label">DAYS</div>
            </div>

            <div class="unit">
                <div class="number" id="hours">00</div>
                <div class="label">HOURS</div>
            </div>

            <div class="unit">
                <div class="number" id="minutes">00</div>
                <div class="label">MINUTES</div>
            </div>

            <div class="unit">
                <div class="number" id="seconds">00</div>
                <div class="label">SECONDS</div>
            </div>
        </div>

        <div class="footer">
            Every second counts. Every effort matters.
        </div>
    </div>

    <!-- Popup image appears automatically -->
    <img
        id="popup-image"
        src="popup.png"
        alt=""
        aria-hidden="true"
    >

    <!-- Optional ticking sound -->
    <button class="sound-toggle" id="sound-toggle" type="button">
        SOUND: OFF
    </button>

    <script>
        /* =========================================
           COUNTDOWN
           ICSE countdown target: 17 February 2027,
           12:00 noon, Indian Standard Time
        ========================================= */

        const targetDate = new Date(
            "2027-02-17T12:00:00+05:30"
        ).getTime();

        const daysElement = document.getElementById("days");
        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");

        function updateCountdown() {
            const now = Date.now();
            let remaining = Math.max(0, targetDate - now);

            const days = Math.floor(
                remaining / (1000 * 60 * 60 * 24)
            );
            remaining %= 1000 * 60 * 60 * 24;

            const hours = Math.floor(
                remaining / (1000 * 60 * 60)
            );
            remaining %= 1000 * 60 * 60;

            const minutes = Math.floor(
                remaining / (1000 * 60)
            );
            remaining %= 1000 * 60;

            const seconds = Math.floor(remaining / 1000);

            daysElement.textContent = String(days).padStart(3, "0");
            hoursElement.textContent = String(hours).padStart(2, "0");
            minutesElement.textContent = String(minutes).padStart(2, "0");
            secondsElement.textContent = String(seconds).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 250);


        /* =========================================
           GOLDEN POINTER GLOW
           Supports mouse, pen and multiple touches
        ========================================= */

        const activeGlows = new Map();

        function createGlow(pointerId, x, y) {
            let glow = activeGlows.get(pointerId);

            if (!glow) {
                glow = document.createElement("div");
                glow.className = "glow";
                document.body.appendChild(glow);
                activeGlows.set(pointerId, glow);
            }

            glow.style.left = x + "px";
            glow.style.top = y + "px";
        }

        function removeGlow(pointerId) {
            const glow = activeGlows.get(pointerId);

            if (glow) {
                glow.remove();
                activeGlows.delete(pointerId);
            }
        }

        document.addEventListener("pointerdown", (event) => {
            createGlow(event.pointerId, event.clientX, event.clientY);
        });

        document.addEventListener("pointermove", (event) => {
            if (
                activeGlows.has(event.pointerId) ||
                event.pointerType === "mouse"
            ) {
                createGlow(
                    event.pointerId,
                    event.clientX,
                    event.clientY
                );
            }
        });

        document.addEventListener("pointerup", (event) => {
            removeGlow(event.pointerId);
        });

        document.addEventListener("pointercancel", (event) => {
            removeGlow(event.pointerId);
        });

        document.addEventListener("pointerleave", (event) => {
            if (event.pointerType === "mouse") {
                removeGlow(event.pointerId);
            }
        });


        /* =========================================
           POPUP IMAGE
           First appears after 24 hours, then repeats
           every 24 hours while the page is active.
           Each display lasts 3 seconds.
        ========================================= */

        const popupImage = document.getElementById("popup-image");

        const POPUP_INTERVAL = 24 * 60 * 60 * 1000;
        const POPUP_DURATION = 3000;
        const LAST_POPUP_KEY = "icseCountdownLastPopup";

        let popupTimeout = null;

        function showPopup() {
            popupImage.classList.remove("visible");

            /* Restart the animation cleanly */
            void popupImage.offsetWidth;

            popupImage.classList.add("visible");

            if (popupTimeout) {
                clearTimeout(popupTimeout);
            }

            popupTimeout = setTimeout(() => {
                popupImage.classList.remove("visible");
            }, POPUP_DURATION);
        }

        function checkPopupSchedule() {
            const now = Date.now();
            const lastPopup = Number(
                localStorage.getItem(LAST_POPUP_KEY) || 0
            );

            if (!lastPopup) {
                /* Start the 24-hour interval on first visit */
                localStorage.setItem(LAST_POPUP_KEY, String(now));
                return;
            }

            if (now - lastPopup >= POPUP_INTERVAL) {
                localStorage.setItem(LAST_POPUP_KEY, String(now));
                showPopup();
            }
        }

        /* Check once on page load */
        checkPopupSchedule();

        /* Check periodically while the page is open */
        setInterval(checkPopupSchedule, 60 * 1000);

        /* Check again when the browser or wallpaper becomes active */
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                checkPopupSchedule();
            }
        });

        window.addEventListener("focus", checkPopupSchedule);


        /* =========================================
           OPTIONAL SYNTHESIZED TICKING SOUND
        ========================================= */

        const soundButton = document.getElementById("sound-toggle");

        let soundEnabled = false;
        let audioContext = null;
        let lastSoundSecond = -1;

        function playTick() {
            if (!soundEnabled) return;

            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) return;

            if (!audioContext) {
                audioContext = new AudioContextClass();
            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.value = 900;

            gain.gain.setValueAtTime(
                0.0001,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.035,
                audioContext.currentTime + 0.005
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioContext.currentTime + 0.045
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        soundButton.addEventListener("click", async () => {
            soundEnabled = !soundEnabled;

            if (soundEnabled) {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                if (AudioContextClass && !audioContext) {
                    audioContext = new AudioContextClass();
                }

                if (audioContext && audioContext.state === "suspended") {
                    await audioContext.resume();
                }

                soundButton.textContent = "SOUND: ON";
                playTick();
            } else {
                soundButton.textContent = "SOUND: OFF";
            }
        });

        setInterval(() => {
            const currentSecond = Math.floor(Date.now() / 1000);

            if (currentSecond !== lastSoundSecond) {
                lastSoundSecond = currentSecond;
                playTick();
            }
        }, 100);
    </script>

</body>
</html>
