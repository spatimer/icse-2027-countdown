
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICSE 2027 | Cyberpunk Countdown</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Rajdhani:wght@400;600;700&display=swap');

*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow:hidden;color:white;
 background:radial-gradient(ellipse at 50% 110%,#18204a,transparent 60%),radial-gradient(ellipse at 15% 15%,#180d35,transparent 45%),#03040c;
 font-family:Rajdhani,sans-serif;display:flex;align-items:center;justify-content:center
}
#stars{position:fixed;inset:0;width:100%;height:100%}
.grid{
 position:fixed;left:-50%;bottom:-48%;width:200%;height:75%;
 background-image:linear-gradient(#00f5ff25 1px,transparent 1px),linear-gradient(90deg,#00f5ff25 1px,transparent 1px);
 background-size:55px 40px;transform:perspective(300px) rotateX(58deg);
 mask-image:linear-gradient(to top,black,transparent 85%)
}
main{width:94%;max-width:1100px;text-align:center;position:relative;z-index:1;padding:20px 0}
.tag{color:#00f5ff;font-family:Orbitron,sans-serif;font-size:clamp(9px,1.5vw,14px);letter-spacing:3px;margin-bottom:24px;text-shadow:0 0 12px #00f5ff}
h1{font-family:Orbitron,sans-serif;font-size:clamp(32px,7vw,76px);line-height:1.15;margin:0;font-weight:800;text-shadow:0 0 8px white,0 0 22px #00d9ff88}
h1 span{display:block;color:#00f5ff;text-shadow:0 0 12px #00eaff,0 0 40px #0077ff}
.subtitle{color:#a9b6d6;font-size:clamp(14px,2.5vw,23px);letter-spacing:4px;margin:18px 0 36px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,2vw,22px);max-width:900px;margin:auto}
.unit{border:1px solid #00eaff66;background:linear-gradient(145deg,#0c1830dd,#090a18ee);padding:clamp(12px,3vw,30px) 3px;border-radius:8px;box-shadow:inset 0 0 22px #00d9ff0b,0 0 18px #00eaff12;position:relative}
.unit:before,.unit:after{content:"";position:absolute;width:18px;height:3px;background:#00f5ff;box-shadow:0 0 8px #00f5ff}
.unit:before{top:-1px;left:12px}.unit:after{bottom:-1px;right:12px}
.number{display:block;font-family:Orbitron,sans-serif;font-size:clamp(20px,6.5vw,66px);font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 14px #00eaff88}
.label{display:block;margin-top:10px;color:#00f5ff;font-family:Orbitron,sans-serif;font-size:clamp(7px,1.4vw,12px);letter-spacing:2px}
.status{min-height:35px;margin-top:28px;color:#ffb8ff;font-size:clamp(12px,2vw,18px);letter-spacing:2px}
.line{width:65%;max-width:400px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,#b44dff,#00f5ff,transparent);box-shadow:0 0 10px #00f5ff}
.footer{color:#7584a8;font-family:Orbitron,sans-serif;font-size:clamp(7px,1.4vw,11px);letter-spacing:2px;margin-top:24px}
.corner{position:fixed;width:45px;height:45px;border-color:#00f5ff88;border-style:solid}
.tl{top:18px;left:18px;border-width:2px 0 0 2px}.tr{top:18px;right:18px;border-width:2px 2px 0 0}.bl{bottom:18px;left:18px;border-width:0 0 2px 2px}.br{bottom:18px;right:18px;border-width:0 2px 2px 0}
@media(max-height:550px){main{padding:8px 0}.tag{margin-bottom:8px}.subtitle{margin:8px 0 15px}.unit{padding:8px 2px}.status{margin-top:10px}.line{margin:10px auto}.footer{margin-top:10px}}
@media(max-width:420px){.tag{letter-spacing:1px}.subtitle{letter-spacing:2px}.label{letter-spacing:0}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="grid"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<main>
 <div class="tag">◈ SYSTEM ONLINE // ACADEMIC COUNTDOWN ◈</div>
 <h1>ICSE <span>2027</span></h1>
 <div class="subtitle">THE FINAL COUNTDOWN</div>
 <div class="timer">
  <div class="unit"><span class="number" id="days">---</span><span class="label">DAYS</span></div>
  <div class="unit"><span class="number" id="hours">--</span><span class="label">HOURS</span></div>
  <div class="unit"><span class="number" id="minutes">--</span><span class="label">MINUTES</span></div>
  <div class="unit"><span class="number" id="seconds">--</span><span class="label">SECONDS</span></div>
 </div>
 <div class="status" id="status">DATE NOT CONFIGURED — AWAITING OFFICIAL TIMETABLE</div>
 <div class="line"></div>
 <div class="footer">STAY FOCUSED · YOUR FUTURE STARTS HERE</div>
</main>
<script>
/* Enter the confirmed exam date here when it is announced.
   Example: new Date(2027,1,15,8,0,0) = 15 February 2027, 8 AM.
   Month numbering starts at 0: January=0, February=1, etc. */
const EXAM_DATE = new Date(2027, 1, 17, 11, 0, 0);;

function updateCountdown(){
 const ids=["days","hours","minutes","seconds"];
 if(!EXAM_DATE || isNaN(EXAM_DATE.getTime())){
  ["---","--","--","--"].forEach((v,i)=>document.getElementById(ids[i]).textContent=v);
  document.getElementById("status").textContent="DATE NOT CONFIGURED — AWAITING OFFICIAL TIMETABLE";
  return;
 }
 let t=Math.max(0,Math.floor((EXAM_DATE-Date.now())/1000));
 const vals=[Math.floor(t/86400),Math.floor(t%86400/3600),Math.floor(t%3600/60),t%60];
 vals.forEach((v,i)=>document.getElementById(ids[i]).textContent=String(v).padStart(i===0?3:2,"0"));
 document.getElementById("status").textContent=t===0?"THE COUNTDOWN HAS ENDED — ALL THE BEST!":"TIME LEFT UNTIL THE EXAM";
}
updateCountdown();setInterval(updateCountdown,1000);

const canvas=document.getElementById("stars"),ctx=canvas.getContext("2d");
let stars=[];
function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;canvas.height=innerHeight*d;
 canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
 ctx.setTransform(d,0,0,d,0,0);
 stars=Array.from({length:Math.min(150,Math.floor(innerWidth*innerHeight/6500))},()=>({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:Math.random()*1.4+.25,a:Math.random()*.65+.2,p:Math.random()*6.28
 }));
}
function draw(){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 const t=performance.now()/1000;
 for(const s of stars){
  ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
  ctx.fillStyle="rgba(135,225,255,"+(s.a*(.65+.35*Math.sin(t*0.7+s.p)))+")";ctx.fill();
 }
 requestAnimationFrame(draw);
}
addEventListener("resize",resize);resize();draw();
</script>
</body>
</html>
