
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>ICSE 2027 | Golden Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  font-family: Arial, Helvetica, sans-serif;
}

/* Keep the complete 16:9 design visible */
.stage {
  position: absolute;
  width: min(100vw, 177.7778vh);
  aspect-ratio: 16 / 9;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  overflow: hidden;
  background: #080808;
}

.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

/* Responsive SVG text layered over the background */
.overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Gold text styling */
.heading {
  fill: #f4c75b;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 7px;
  text-anchor: middle;
}

.countdown {
  fill: #ffe5a0;
  font-size: 77px;
  font-weight: 800;
  letter-spacing: 1px;
  text-anchor: middle;
  filter: url(#goldGlow);
  font-variant-numeric: tabular-nums;
}

.labels {
  fill: #e8bd53;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 4px;
  text-anchor: middle;
}

.quote {
  fill: #f4c75b;
  font-size: 23px;
  font-weight: 600;
  letter-spacing: 2px;
  text-anchor: middle;
}

.exam {
  fill: #fff0c6;
  font-size: 37px;
  font-weight: 800;
  letter-spacing: 3px;
  text-anchor: middle;
}

@media (max-width: 600px) {
  .heading {
    font-size: 23px;
    letter-spacing: 5px;
  }

  .countdown {
    font-size: 76px;
  }

  .labels {
    font-size: 18px;
    letter-spacing: 3px;
  }

  .exam {
    font-size: 36px;
  }

  .quote {
    font-size: 21px;
    letter-spacing: 1px;
  }
}
</style>
</head>

<body>
<div class="stage">

  <img class="background" src="./background.png" alt="">

  <svg class="overlay"
       viewBox="0 0 1600 900"
       preserveAspectRatio="none"
       role="img"
       aria-label="ICSE 2027 exam countdown">

    <defs>
      <filter id="goldGlow" x="-30%" y="-50%"
              width="160%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Gentle upward curve for the timer -->
      <path id="timerCurve"
            d="M 280 445 Q 800 365 1320 445"/>

      <!-- Gentle curve for the motivational quote -->
      <path id="quoteCurve"
            d="M 440 600 Q 800 630 1160 600"/>

      <path id="headingCurve"
            d="M 480 345 Q 800 315 1120 345"/>
    </defs>

    <text class="heading">
      <textPath href="#headingCurve"
                startOffset="50%">
        EXAM COUNTDOWN
      </textPath>
    </text>

    <text class="countdown">
      <textPath id="timerText"
                href="#timerCurve"
                startOffset="50%">
        000 : 00 : 00 : 00
      </textPath>
    </text>

    <text class="labels" x="800" y="500">
      DAYS
      <tspan dx="45">HRS</tspan>
      <tspan dx="45">MIN</tspan>
      <tspan dx="45">SEC</tspan>
    </text>

    <text class="exam" x="800" y="555">
      ICSE 2027
    </text>

    <text class="quote">
      <textPath href="#quoteCurve"
                startOffset="50%">
        SMALL STEPS TODAY. BIG RESULTS TOMORROW.
      </textPath>
    </text>

  </svg>
</div>

<script>
/*
  Target: 17 February 2027 at 12:00 PM local time.
  Change this date if your official exam date is different.
*/
const examDate = new Date(2027, 1, 17, 12, 0, 0);

const timerText = document.getElementById("timerText");

function updateCountdown() {
  const remaining = Math.max(
    0,
    examDate.getTime() - Date.now()
  );

  const totalSeconds = Math.floor(remaining / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const formatted =
    String(days).padStart(3, "0") + " : " +
    String(hours).padStart(2, "0") + " : " +
    String(minutes).padStart(2, "0") + " : " +
    String(seconds).padStart(2, "0");

  timerText.textContent = formatted;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
